    });

    chain = chain.then(function () { return RC.ai.generateDocument(sel, 'altform-dongguk-2027'); }).then(function (r) {
      f.prompts['altform-dongguk-2027'] = r.prompts;
      var keep = (f.alt.rows || []).filter(function (x) { return f.selected.indexOf(x.pid) >= 0 || !x.pid; });
    if (!f.alt.head) f.alt.head = { track: '', unit: '' };
      r.sections.rows.forEach(function (row) { if (!keep.some(function (x) { return x.pid === row.pid; })) keep.push(row); });

  };

  function refsHtml(p) {

      t.sections.map(function (sec) {

          '<div class="ta">' + (single ? '<input data-in="profile" data-k="' + sec.key + '"' + (sec.limit ? ' maxlength="' + sec.limit + '"' : '') + ' value="' + esc(v) + '" placeholder="' + esc(sec.ph || '') + '">' :

  V.ins['profile'] = function (el) {

    var f = pf(), cur = curPid(), isP = cur === PROFILE;

      '<div style="display:flex;gap:12px;align-items:center"><span class="save-state" id="saveState">' + saveBadge('saved') + '</span><button class="btn primary" data-act="preview">' + icon('eye') + ' 미리보기</button></div></div>';

  function wordDiff(a, b) {
    var A = a.split(/(\s+)/).filter(function (x) { return x !== ''; }), B = b.split(/(\s+)/).filter(function (x) { return x !== ''; });
    var n = A.length, m = B.length, dp = [], i, j;
    for (i = 0; i <= n; i++) { dp.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var out = '', ds = '', is = '';
    function flush() { if (ds) out += '<del>' + esc(ds) + '</del>'; if (is) out += '<ins>' + esc(is) + '</ins>'; ds = ''; is = ''; }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { flush(); out += esc(A[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ds += A[i++]; } else { is += B[j++]; }
    }
    while (i < n) ds += A[i++]; while (j < m) is += B[j++];
    flush(); return out;
  }

    function page(l, main) { return '<section class="pf-page">' + left(l) + '<main class="pf-right">' + main + '</main><span class="pf-brand">RE:Cord</span></section>'; }
    function firstSentence(t) { t = (t || '').trim(); var i = t.indexOf('. '); return i > 0 ? t.slice(0, i + 1) : t; }
    var greet = '<div class="pf-label">Portfolio</div><div class="pf-avatar"><span>' + esc(name.charAt(0)) + '</span></div>' +
      '<div class="pf-hello">안녕하세요<br>' + esc(r.slogan || '프로젝트로 배우는 학생') + '<br><em>' + esc(name) + '</em>입니다</div>' +
      '<div class="pf-contact"><b>' + esc(name) + '</b>' + (r.education ? '<span>' + esc(r.education) + '</span>' : '<span class="ph">학교 · 학과 (직접 입력)</span>') + '<span class="ph">연락처 · 이메일 (제출 시 직접)</span><span>' + (esc(r.link) || '<i class="ph">포트폴리오 or SNS 링크</i>') + '</span></div>';
    var col1 = sec('cap', entry(r.education || '학교명 · 학과 (직접 입력)', r.education ? '재학 중' : '')) +
      sec('trophy', (r.awards ? r.awards.split(/\n/).filter(Boolean).map(function (a) { return entry(a, ''); }).join('') : '<div class="pf-entry ph"><b>수상 · 자격증</b><span>기록에 없어 비워 두었어요</span></div>')) +
      sec('laptop', skills.length ? skills.map(function (k) { var pct = 45 + Math.round(55 * (tagCount[k] || 1) / maxc); return '<div class="pf-skill"><span>' + esc(k) + '</span><i><b style="width:' + pct + '%"></b></i></div>'; }).join('') : '<div class="pf-entry ph"><b>스킬 · 관심 키워드</b></div>');
    var col2 = sec('bulb', f.order.map(function (pid) { var p = proj(pid), d = f.drafts[pid] || {}, e = RC.store.mainExp(pid); return entry('주요 프로젝트 · ' + p.name, RC.u.period(p), (e && e.summary) || firstSentence(d.result) || p.topic || ''); }).join(''));
    var html = page(greet, '<div class="pf-cols"><div>' + col1 + '</div><div>' + col2 + '</div></div>');
    f.order.forEach(function (pid, i) {
      var p = proj(pid), d = f.drafts[pid] || {}, e = p.experience || {}, me = RC.store.mainExp(pid);
      var tags = (me && me.tags || e.interests || []).slice(0, 6);
      var recs = (me && me.records || []).slice(0, 4);
      if (!recs.length) recs = (p.notes || []).filter(function (n) { return n.text; }).slice(0, 4).map(function (n) { return { name: n.name }; });
      var aside = '<div class="pf-slogan">' + RC.u.pad(i + 1) + '<br>' + esc(p.name) + '<small>' + RC.u.period(p) + (p.topic ? ' · ' + esc(p.topic) : '') + '</small></div>' +
        '<div class="pf-meta">' + (e.role ? '<b>ROLE</b><span>' + esc(e.role) + '</span>' : '') + (e.activity ? '<b>ACTIVITY</b><span>' + esc(e.activity) + '</span>' : '') + '</div>' +
        (tags.length ? '<div class="pf-tags">' + tags.map(function (t) { return '<i>' + esc(t) + '</i>'; }).join('') + '</div>' : '') +
        (recs.length ? '<div class="pf-recs"><b>EVIDENCE · 근거 기록</b><ul>' + recs.map(function (r) { return '<li>' + esc(r.name) + '</li>'; }).join('') + '</ul></div>' : '');
      var callout = (me && me.summary) ? '<div class="pf-callout"><b>한눈에</b>' + esc(me.summary) + '</div>' : '';
      html += page(aside, callout + SECS.map(function (s) { return '<div class="pf-essay"><h4>' + esc(s[1]) + '</h4><p>' + (esc(d[s[0]]) || '<i class="ph">(기록 없음)</i>') + '</p></div>'; }).join(''));
    });
    html += page('<div class="pf-slogan">' + esc(firstSentence(r.aspiration) || r.slogan || '기록으로 배우고, 배운 것을 다음 프로젝트로 잇겠습니다') + '</div>',
      '<div class="pf-essay"><h4>지원동기</h4><p>' + (esc(r.motivation) || '<i class="ph">자기소개서를 입력하세요.</i>') + '</p></div><div class="pf-essay"><h4>앞으로의 포부</h4><p>' + (esc(r.aspiration) || '<i class="ph">자기소개서를 입력하세요.</i>') + '</p></div>');
    return '<div class="pf-doc">' + html + '</div>';
  }
  V.acts['preview'] = function () {
    var f = pf(), t = tpl(), html, landscape = t.type !== 'altform';
    if (t.type === 'altform') html = altSheet(false) + printNotice(t);
    else html = pfSheet() + printNotice(t);
    html += '<style>@page{size:A4 ' + (landscape ? 'landscape' : 'portrait') + ';margin:10mm}</style>';
    var m = RC.modal({ title: '미리보기', wide: true, html: html + '<div class="modal-actions no-print"><button class="btn" data-close>닫기</button><button class="btn primary" data-print>' + icon('printer') + ' 인쇄 / PDF 저장</button></div>', noFocus: true });
    m.el.style.width = landscape ? 'min(1180px,100%)' : 'min(900px,100%)';
    m.$('[data-close]').onclick = m.close;
    m.$('[data-print]').onclick = function () {
      document.body.classList.add('printing');
      var done = function () { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done); window.print();
    };
  };

  function render() {
    var f = pf(), t = tpl(), html;
    if (step === 3 && (!f.built || !f.order.length)) { RC.go('#/portfolio/2'); return; }
    if (step === 1) html = step1();
    else if (step === 2) html = step2();
    else html = t.type === 'altform' ? step3Alt() : step3Project();
    root.innerHTML = '<div class="page">' + html + '</div>';
  }

  V.mount = function (el, r) { root = el; step = r.step; diff = diff && step === 3 ? diff : null; render(); };
  RC.views = RC.views || {}; RC.views.portfolio = V;
})(window.RC);

</script>
<script>
/* 스크랩 (#/scraps) — 대학 · 직무 · 채용공고 · 노드 노트를 모아 보고 메모를 고친다 (v2) */
window.RC = window.RC || {};
(function (RC) {
  var esc = RC.u.esc, icon = RC.icon;
  var V = { acts: {}, ins: {} };
  var root = null, tab = 'all', memoTimer = null;
  var TABS = [['all', '전체'], ['school', '대학'], ['job', '직무'], ['posting', '채용공고'], ['node', '노드 노트']];
  var KIND = { school: '대학', job: '직무', posting: '채용공고', node: '노드 노트' };
  function todoKey(x) { return x.type === 'node' ? null : x.type + ':' + x.refId; }
  function defaults(x) { return x.type === 'school' ? RC.mock.schoolChecklist : x.type === 'job' ? RC.mock.jobChecklist : RC.mock.postingChecklist; }
  function card(x) {
    var tk = todoKey(x);
    return '<div class="card sc-card" data-scrap="' + esc(x.id) + '"><div class="kind">' + icon(x.type === 'posting' ? 'file' : x.type === 'node' ? 'pen' : 'graph') + esc(KIND[x.type] || x.type) + RC.ui.scrapBtn(x.type, x.refId) + '</div>' +
      '<h3>' + esc(x.title) + '</h3><div class="meta">' + esc(x.meta) + ' · ' + RC.u.noteDate(x.createdAt) + '</div>' +
      (x.type === 'posting' ? RC.ui.notice('job') : x.type === 'school' ? RC.ui.notice('school') : '') +
      '<textarea data-in="sc-memo" data-id="' + esc(x.id) + '" placeholder="메모를 남겨 두세요 (자동 저장)" aria-label="메모">' + esc(x.memo || '') + '</textarea>' +
      (x.note ? '<div class="note"><b>함께 저장한 노트</b>' + esc(x.note) + '</div>' : '') +
      '<div class="acts"><button class="btn sm primary" data-act="sc-go" data-id="' + esc(x.id) + '">' + icon('graph') + ' 원래 위치로 이동</button><button class="btn sm" data-act="sc-remove" data-id="' + esc(x.id) + '">스크랩 해제</button></div>' +
      (tk ? RC.ui.todoList(tk, defaults(x)) : '') + '</div>';
  }
  function render() {
    var list = RC.store.scraps.list(tab), all = RC.store.scraps.list('all');
    root.innerHTML = '<div class="page"><div class="page-head"><div><h1 class="title">스크랩</h1><p class="subtitle">다시 보고 싶은 대학·직무·채용공고와 노드 노트를 모아 둬요.</p></div><span class="sample-badge">' + all.length + '개</span></div>' +
      '<div class="sc-tabs">' + TABS.map(function (t) { var n = t[0] === 'all' ? all.length : all.filter(function (x) { return x.type === t[0]; }).length; return '<button class="' + (tab === t[0] ? 'on' : '') + '" data-act="sc-tab" data-tab="' + t[0] + '">' + t[1] + (n ? ' ' + n : '') + '</button>'; }).join('') + '</div>' +
      RC.ui.notice('ai') +
      (list.length ? '<div class="sc-grid">' + list.map(card).join('') + '</div>' :
        '<div class="sc-empty">' + (all.length ? '이 종류의 스크랩이 아직 없어요.' : '아직 스크랩이 없어요.<br>연결 그래프에서 학교·직무·채용공고 옆의 ★을 누르면 여기에 모여요.') + '<br><a href="#/learning" class="btn sm" style="margin-top:14px">연결 그래프로 가기</a></div>') + '</div>';
  }
  V.acts['sc-tab'] = function (el) { tab = el.dataset.tab; render(); };
  V.acts['sc-remove'] = function (el) { RC.store.scraps.remove(el.dataset.id); RC.toast('스크랩을 해제했어요'); render(); };
  // 원래 위치로: 그래프 탐색 상태(mode/path/sel)를 스크랩 당시로 되돌리고 #/learning 으로 이동
  V.acts['sc-go'] = function (el) {
    var x = RC.store.scraps.byId(el.dataset.id); if (!x) return;
    var loc = x.loc || {}, u = RC.state.ui, seen = (u.career && u.career.seen) || {};
    if (loc.mode) { u.career = { mode: loc.mode, path: (loc.path || []).slice(), sel: loc.sel || null, seen: seen }; seen[loc.mode] = true; }
    u.noteOpen = null;
    var L = RC.views.learning;
    if (loc.posting && L.openPosting) L.openPosting(loc.posting);
    else if (loc.note && L.openNote) L.openNote(loc.note);
    else if (loc.project && L.openProject) L.openProject(loc.project);
    RC.store.save(); RC.go('#/learning');
  };
  V.ins['sc-memo'] = function (el) { clearTimeout(memoTimer); var id = el.dataset.id, v = el.value; memoTimer = setTimeout(function () { RC.store.scraps.updateMemo(id, v); }, 400); };
  RC.ui.bindCommon(V, function (kind) { if (kind === 'scrap') render(); });
  V.destroy = function () { clearTimeout(memoTimer); };
  V.mount = function (el) { root = el; render(); };
  RC.views = RC.views || {}; RC.views.scraps = V;
})(window.RC);

</script>
<script>
/* App shell: sidebar, topbar, search, hash router */
(function (RC) {
  var esc = RC.u.esc, icon = RC.icon;
  var $ = function (id) { return document.getElementById(id); };
  var viewEl;

  function route() {
    var h = (location.hash || '#/projects').replace(/^#\/?/, '').split('/');
    var top = h[0] || 'projects';
    if (top === 'learning') return { name: 'learning', nav: 'learning' };
    if (top === 'portfolio') return { name: 'portfolio', step: Math.min(3, Math.max(1, parseInt(h[1], 10) || 1)), nav: 'portfolio' };
    if (top === 'coach') return { name: 'coach', nav: 'coach' };
    if (top === 'scraps') return { name: 'scraps', nav: 'scraps' };
    return { name: 'projects', nav: 'projects' };
  }

  function renderSidebar(r) {
    var items = [['projects', '#/projects', 'home', '프로젝트 관리'], ['learning', '#/learning', 'graph', '연결 그래프'], ['scraps', '#/scraps', 'star', '스크랩'], ['portfolio', '#/portfolio/1', 'file', '포트폴리오 만들기']];
    $('sidebar').innerHTML = '<a class="logo" href="#/projects"><span class="logo-row">' + RC.logo + 'RE:Cord</span></a>' +
      '<nav class="nav">' + items.map(function (i) {
        return '<a href="' + i[1] + '" class="' + (r.nav === i[0] ? 'active' : '') + '">' + icon(i[2]) + i[3] + '</a>';
      }).join('') + '</nav>' +
      '<div class="side-foot">중간 체크인 프로토타입<br>샘플 데이터 · 브라우저에만 저장돼요.</div>';
  }

  function renderTopbar() {
    $('topbar').innerHTML = '<div class="search">' + icon('search') + '<input id="q" placeholder="프로젝트 · 노트 검색" autocomplete="off" aria-label="검색"><div class="search-pop hidden" id="qpop"></div></div>' +
      '<button class="icon-btn" aria-label="알림" id="bell">' + icon('bell') + '<span class="badge"></span></button>' +
      '<div class="user"><button class="user-btn" id="userbtn" data-menu><span class="avatar">' + esc(RC.state.user.name.charAt(0)) + '</span><span class="nm">' + esc(RC.state.user.name) + '님</span>' + icon('chevD') + '</button></div>';
  }

  function render() {
    var r = route();
    renderSidebar(r);
    RC.closeMenus();
    var V = RC.views[r.name];
    RC.cur = V; RC.route = r;
    if (V.destroy) V.destroy();
    window.scrollTo(0, 0);
    V.mount(viewEl, r);
  }

  /* ---------- search ---------- */
  function hi(text, q) {
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }
  function search(q) {
    q = q.trim(); var out = [];
    if (!q) return out;
    var m = function (s) { return (s || '').toLowerCase().indexOf(q.toLowerCase()) >= 0; };
    RC.state.projects.forEach(function (p) {
      if (m(p.name) || m(p.topic)) out.push({ g: '프로젝트', label: p.name, ico: 'home', go: { t: 'project', pid: p.id } });
      p.notes.forEach(function (n) { if (m(n.name) || m(n.text)) out.push({ g: '노트', label: n.name + ' · ' + p.shortName, ico: RC.noteIcon(n), go: { t: 'note', pid: p.id, nid: n.id } }); });
    });
    RC.state.experiences.forEach(function (e) {
      if (m(e.name) || (e.tags || []).some(m) || m(e.desc)) out.push({ g: '경험·키워드', label: e.name, ico: 'graph', go: { t: 'exp', eid: e.id } });
    });
    RC.state.interests.forEach(function (i) { if (m(i)) out.push({ g: '경험·키워드', label: '관심사 · ' + i, ico: 'sparkle', go: { t: 'interest', name: i } }); });
    (RC.state.graphNotes || []).forEach(function (n) { if (m(n.title) || m(n.body)) out.push({ g: '내 노트', label: n.title || '제목 없음', ico: 'pen', go: { t: 'gnote', id: n.id } }); });
    return out.slice(0, 12);
  }
  function bindSearch() {
    var q = $('q'), pop = $('qpop'), results = [];
    q.addEventListener('input', function () {
      results = search(q.value);
      if (!q.value.trim()) { pop.classList.add('hidden'); return; }
      var last = '';
      pop.innerHTML = results.length ? results.map(function (r, i) {
        var h = r.g !== last ? '<h6>' + r.g + '</h6>' : ''; last = r.g;
        return h + '<button data-i="' + i + '">' + icon(r.ico) + '<span>' + hi(r.label, q.value.trim()) + '</span></button>';
      }).join('') : '<div class="empty">검색 결과가 없어요</div>';
      pop.classList.remove('hidden');
    });
    pop.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var g = results[+b.dataset.i].go; pop.classList.add('hidden'); q.value = '';
      var s = RC.state.ui;
      if (g.t === 'project') { s.selectedProject = g.pid; s.projectTab = 'files'; RC.go('#/projects'); }
      else if (g.t === 'note') { RC.views.projects.focusNote(g.pid, g.nid); RC.go('#/projects'); }
      else if (g.t === 'gnote') { RC.views.learning.openNote(g.id); RC.go('#/learning'); }
      else if (g.t === 'exp') { s.selectedExp = g.eid; RC.go('#/learning'); }
      else { s.selectedInterest = g.name; RC.go('#/learning'); }
      RC.store.save();
    });
    document.addEventListener('click', function (e) { if (!e.target.closest('.search')) pop.classList.add('hidden'); });
  }

  function bindUser() {
    document.addEventListener('click', function (e) {
      var b = e.target.closest('#userbtn'); if (!b) return;
      RC.popMenu(b, [{ label: '데모 데이터 초기화', icon: 'reset', fn: resetDemo }]);
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('#bell')) RC.toast('새 알림이 없어요. 코치 알림은 다음 학기에 제공돼요.');
    });
  }
  function resetDemo() {
    RC.confirm('모든 변경을 지우고 처음 시연 상태로 되돌릴까요?', '초기화', true).then(function (ok) {
      if (!ok) return;
      RC.store.reset(); renderTopbar(); bindSearch();
      if (location.hash !== '#/projects') location.hash = '#/projects'; else render();
      RC.toast('데모 데이터를 초기화했어요');
    });
  }

  /* ---------- coach (out of scope placeholder) ---------- */
  RC.views = RC.views || {};
  RC.views.coach = {
    acts: {}, ins: {},
    mount: function (el) {
      el.innerHTML = '<div class="page"><h1 class="title">코치 상담함</h1><p class="subtitle">코치와 함께 기록을 살펴보는 공간이에요.</p><div class="card coach-empty" style="margin-top:20px"><div>' + RC.sprout +
        '<h2>다음 학기 고도화 예정이에요</h2><p>코치 검토·승인 시스템은 이번 학기 개발 범위에서 제외되었어요.<br>지금은 학생이 직접 기록을 확인하고 수정하는 흐름에 집중하고 있어요.</p></div></div></div>';
    }
  };

  function boot() {
    RC.store.load();
    viewEl = $('view');
    renderTopbar(); bindSearch(); bindUser();
    // event delegation for views
    viewEl.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]'); if (!el || !RC.cur) return;
      var fn = RC.cur.acts[el.dataset.act]; if (fn) fn(el, e);
    });
    ['input', 'change'].forEach(function (ev) {
      viewEl.addEventListener(ev, function (e) {
        var el = e.target.closest('[data-in]'); if (!el || !RC.cur) return;
        var fn = RC.cur.ins[el.dataset.in]; if (fn) fn(el, e);
      });
    });
    viewEl.addEventListener('focusin', function (e) {
      var el = e.target.closest('[data-focus]'); if (el && RC.cur && RC.cur.ins[el.dataset.focus]) RC.cur.ins[el.dataset.focus](el, e);
    });
    window.addEventListener('hashchange', render);
    if (!location.hash) location.hash = '#/projects'; else render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.RC);

</script>
