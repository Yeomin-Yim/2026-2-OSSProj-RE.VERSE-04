<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE:Cord — 중간 체크인 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* RE:Cord demo — design system (extracted from ref/design screenshots) */
:root{
  /* 임시 무채색 디자인 (브랜드 컬러·로고는 10/29 팀 회의에서 확정 예정) */
  --bg:#F6F6F7; --card:#fff; --line:#E5E7EB;
  --primary:#1F2328; --primary-dark:#000; --lav:#F1F2F4; --lav-line:#C9CDD3;
  --accent:#2563EB;
  --text:#1F2328; --sub:#6B7280; --hint:#9CA3AF;
  --chip-off:#F3F4F6; --danger:#DC2626; --ok:#15803D;
  --graph:#1F2328;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.03);
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;flex-direction:column;gap:2px;padding:0 8px 22px;cursor:pointer}
.logo-row{display:flex;align-items:center;gap:7px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo-row svg{width:26px;height:26px}
.logo small{font-size:10.5px;color:var(--sub);line-height:1.35;margin-top:4px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:var(--text);font-weight:500;font-size:13px;position:relative}
.nav a:hover{background:#F3F4F6}
.nav a.active{background:var(--lav);color:var(--primary);font-weight:700}
.nav .dot{width:6px;height:6px;border-radius:50%;background:#2563EB;margin-left:auto}
.side-foot{margin-top:auto;border:1px dashed var(--line);border-radius:10px;padding:12px;background:#FAFAFB;font-size:11px;color:var(--sub);line-height:1.5}
.side-foot svg.sprout{width:20px;height:20px;color:var(--primary);display:block;margin-bottom:4px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 32px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.search{position:relative;width:260px}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:#F7F8FC;padding:0 10px 0 30px;font-size:11.5px;outline:none}
.search input:focus{border-color:var(--lav-line);background:#fff}
.search>svg{position:absolute;left:10px;top:8px;width:15px;height:15px;color:var(--sub)}
.search-pop{position:absolute;top:38px;left:0;right:0;min-width:320px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(30,32,51,.12);max-height:380px;overflow:auto;padding:6px;z-index:50}
.search-pop h6{margin:8px 8px 4px;font-size:11px;color:var(--hint);font-weight:600}
.search-pop button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:7px;font-size:12.5px}
.search-pop button:hover{background:var(--lav)}
.search-pop .empty{padding:14px;text-align:center;color:var(--sub);font-size:12px}
.search-pop mark{background:#FDE68A;color:inherit;border-radius:3px}
.icon-btn{position:relative;width:32px;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{background:#F3F4F6}
.icon-btn .badge{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#F0443A;border:1.5px solid #fff}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:3px 6px;border-radius:9px;font-size:12px;font-weight:600}
.user-btn:hover{background:#F3F4F6}
.avatar{width:26px;height:26px;border-radius:50%;background:#E5E7EB;color:#1F2328;display:grid;place-items:center;font-weight:700;font-size:12px}
.menu{position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(30,32,51,.14);min-width:170px;padding:5px;z-index:60}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--text)}
.menu button:hover{background:var(--lav)}
.menu button.danger{color:var(--danger)}
.page{padding:26px 32px 40px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
h1.title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px}
.subtitle{margin:6px 0 0;color:var(--sub);font-size:12.5px}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:12.5px;font-weight:600}
.btn:hover{background:#F7F7F8}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.primary:disabled{background:#B8BCC4;border-color:#B8BCC4;cursor:not-allowed}
.btn.ghost{border-color:#D1D5DB;color:var(--primary);background:#fff;height:26px;padding:0 10px;font-size:11px}
.btn.danger{color:var(--danger);border-color:#F3C9CB}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px}
.btn.block{width:100%}
.badge-ai{display:inline-block;background:var(--lav);color:var(--primary);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--chip-off);color:#9094A4;transition:all .35s}
.chip.on{background:#EFF4FF;color:#1D4ED8}
.chip.pop{animation:pop .7s}
.chip.shimmer{animation:shimmer 1s infinite linear;background:linear-gradient(90deg,#EEF0F2 25%,#F7F7F8 50%,#EEF0F2 75%);background-size:200% 100%;color:transparent}
@keyframes pop{0%{transform:scale(.7)}40%{transform:scale(1.18);box-shadow:0 0 0 6px rgba(37,99,235,.18)}100%{transform:scale(1)}}
@keyframes shimmer{to{background-position:-200% 0}}
.hint{color:var(--hint);font-size:11px}
.sub{color:var(--sub)}
.sr{position:absolute;left:-9999px}

/* ---------- toast / modal ---------- */
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{background:#1F2328;color:#fff;border-radius:10px;padding:11px 18px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastin .3s}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
.overlay{position:fixed;inset:0;background:rgba(30,32,51,.45);display:grid;place-items:center;z-index:100;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(820px,100%)}
.modal h3{margin:0 0 14px;font-size:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--sub)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;background:#fff;font-size:13px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--lav-line);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.field textarea{min-height:110px;resize:vertical;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.modal-actions .left{margin-right:auto}
.seg{display:inline-flex;background:#F1F2F4;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.img-zoom{max-width:100%;border-radius:8px}
.note-body{white-space:pre-wrap;line-height:1.7;background:#FAFAFB;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px}

/* ---------- projects ---------- */
.proj-grid{display:grid;grid-template-columns:190px minmax(0,1fr) 262px;gap:16px;align-items:start}
.panel{padding:16px}
.panel h2{margin:0;font-size:14px;font-weight:700}
.proj-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.proj-list-head .count{color:var(--primary);font-size:12px;font-weight:700}
.proj-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
.proj-item b{display:block;font-size:12.5px}
.proj-item small{color:var(--sub);font-size:11px}
.proj-item.sel{background:var(--lav);border-color:var(--lav-line)}
.proj-item.sel b{color:var(--primary)}
.proj-item svg{color:var(--sub)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.detail-head h2{font-size:16px}
.detail-head .period{color:var(--sub);font-size:11.5px;margin-top:3px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:14px 0 14px}
.tabs button{background:none;border:0;padding:8px 0 10px;font-size:12px;color:var(--sub);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--text)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head h3{margin:0;font-size:13px}
.dropzone{border:1.5px dashed #C9CDD3;background:#FAFAFB;border-radius:10px;text-align:center;padding:22px 12px;cursor:pointer;transition:all .2s}
.dropzone.over{background:var(--lav);border-color:var(--primary)}
.dropzone svg{width:24px;height:24px;color:var(--primary);margin-bottom:4px}
.dropzone b{display:block;font-size:12.5px;color:var(--primary);font-weight:600}
.dropzone .t2{font-size:11px;color:var(--sub);margin-top:2px}
.dropzone .t3{font-size:10.5px;color:var(--hint);margin-top:12px}
.note{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #F1F2F4;position:relative}
.note:last-child{border:0}
.note.flash{animation:flash 1.8s}
@keyframes flash{0%,60%{background:var(--lav)}100%{background:transparent}}
.note .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--lav);color:var(--primary);flex:none;overflow:hidden}
.note .ico img{width:100%;height:100%;object-fit:cover}
.note .nm{flex:1;min-width:0}
.note .nm b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .nm small{color:var(--hint);font-size:10.5px}
.note .type{font-size:11px;color:var(--sub);width:44px;text-align:right}
.tag-result{font-size:10px;background:#ECFDF3;color:var(--ok);border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:700}
.empty-note{text-align:center;color:var(--hint);padding:26px 0;font-size:12px}
.form-block{margin-bottom:14px}
.form-block label{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;margin-bottom:5px}
.form-block textarea,.form-block input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;outline:none;line-height:1.55;resize:vertical;min-height:38px}
.form-block textarea:focus,.form-block input:focus{border-color:var(--lav-line)}
.form-block.ai textarea,.form-block.ai input{background:#FAFAFB;border-color:#D1D5DB}
.right-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--primary)}
.right-title svg{width:15px;height:15px}
.guide{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:10px;display:flex;gap:10px;background:#fff;overflow:hidden;max-height:260px;transition:all .45s}
.guide.leave{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-top:0;border-width:0;transform:translateX(20px)}
.guide.enter{animation:gin .5s}
@keyframes gin{from{opacity:0;transform:translateY(-8px)}}
.guide .gi{width:30px;height:30px;border-radius:8px;background:var(--lav);color:var(--primary);display:grid;place-items:center;flex:none}
.guide b{display:block;font-size:12px}
.guide p{margin:2px 0 6px;font-size:10.5px;color:var(--sub);line-height:1.4}
.guide .link{background:none;border:0;padding:0;color:var(--primary);font-size:11px;font-weight:700;display:flex;align-items:center;gap:2px}
.guide textarea{width:100%;margin:4px 0 6px;min-height:64px;border:1px solid var(--lav-line);border-radius:8px;padding:7px;font-size:12px;outline:none;resize:vertical}
.guide .gbtns{display:flex;gap:6px}
.all-good{margin-top:10px;background:#F0FDF4;color:var(--ok);border-radius:10px;padding:12px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.quote{margin-top:14px;border-radius:10px;background:#F7F7F8;padding:14px 12px;display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;color:var(--primary);font-weight:600;line-height:1.5;min-height:62px}
.quote svg{width:48px;height:48px}
.quote .by{display:block;color:var(--sub);font-weight:400;margin-top:2px}

/* ---------- learning: 연결 그래프 (나의 배움 정리) ---------- */
.lm .page-head{align-items:flex-end}
.lm .sample-badge{padding:6px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:11px;white-space:nowrap}
.lm .workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:640px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.lm .graph-shell{min-width:0;position:relative;background:#FAFAFB}
.lm .stage{position:absolute;inset:0;overflow:hidden}
.lm .stage>div{position:absolute;inset:0}
.lm .stage canvas{display:block}
.lm .graph-toolbar{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.lm .graph-toolbar>*{pointer-events:auto}
.lm .crumbs{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.lm .lm-crumb{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:600}
.lm .lm-crumb:hover{border-color:#C9CDD3;color:var(--text)}
.lm .lm-crumb.current{background:var(--text);border-color:var(--text);color:#fff}
.lm .crumb-sep{color:var(--hint);font-size:11px}
.lm .toolbar-actions{margin-left:auto;display:flex;gap:6px}
.lm .tool-btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.lm .tool-btn:hover{background:#F3F4F6}
.lm .tool-btn.add{background:var(--accent);border-color:var(--accent);color:#fff}
.lm .tool-btn.add:hover{background:#1D4ED8}
.lm .tool-btn[hidden]{display:none}
.lm .zoom{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.2s}
.lm .zoom button{width:32px;height:32px;border:0;background:transparent;font-size:15px;color:var(--text)}
.lm .zoom button+button{border-top:1px solid var(--line)}
.lm .zoom button:hover{background:#F3F4F6}
.lm .legend{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);font-size:11px;color:var(--sub);max-width:calc(100% - 80px);transition:.2s}
.lm .legend span{display:inline-flex;align-items:center;gap:5px}
.lm .legend i,.lm .next-btn i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.lm i.sq{border-radius:2px;background:#1F2328}
.lm i.nt{background:var(--accent);border-radius:2px;width:11px}
.lm .decision{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:64px 28px 28px;background:rgba(250,250,251,.9);backdrop-filter:blur(2px);transition:.25s}
.lm .decision.hidden{opacity:0;pointer-events:none}
.lm .decision-inner{width:min(560px,100%);text-align:center}
.lm .decision h2{margin:0 0 4px;font-size:22px;letter-spacing:-.03em}
.lm .decision .lead{margin:0 0 22px;color:var(--sub);font-size:13px}
.lm .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lm .choice{text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:22px;transition:.15s;color:var(--text)}
.lm .choice:hover,.lm .choice:focus-visible{border-color:var(--text);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.lm .choice-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#F3F4F6}
.lm .choice h3{margin:14px 0 3px;font-size:16px}
.lm .choice p{margin:0;color:var(--sub);font-size:12px}
.lm .decision:not(.hidden)~.legend,.lm .decision:not(.hidden)~.zoom{opacity:0;pointer-events:none}
.lm .no-graph{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;text-align:center;padding:20px}
.lm .lm-panel{padding:20px 18px;overflow:auto;border-left:1px solid var(--line);background:#fff}
.lm .panel-label{font-size:11px;font-weight:700;color:var(--sub)}
.lm .lm-panel h2{margin:5px 0 6px;font-size:19px;letter-spacing:-.03em;word-break:keep-all}
.lm .lm-panel .desc{margin:0;color:var(--sub);font-size:12px;line-height:1.6;word-break:keep-all}
.lm .score-card{margin:14px 0 2px}
.lm .score-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub)}
.lm .score-top em{font-style:normal;font-size:10px;color:var(--hint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:3px}
.lm .score-top span{font-weight:800;color:var(--text);font-size:14px}
.lm .bar{height:6px;margin-top:6px;border-radius:99px;background:#EEF0F2;overflow:hidden}
.lm .bar i{display:block;height:100%;background:var(--text);border-radius:inherit}
.lm .section-title{font-size:11px;color:var(--sub);font-weight:700;margin:18px 0 8px}
.lm .next-list{display:grid;gap:6px}
.lm .next-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;color:var(--text)}
.lm .next-btn:hover,.lm .next-btn:focus-visible{border-color:#C9CDD3;background:#F9FAFB}
.lm .next-btn.on{border-color:var(--text)}
.lm .next-btn small{color:var(--hint);font-weight:500;font-size:10.5px;margin-left:auto;text-align:right}
.lm .tags{display:flex;flex-wrap:wrap;gap:5px}
.lm .tag{padding:4px 8px;border-radius:6px;background:#F3F4F6;color:#4B5563;font-size:10.5px;font-weight:600}
.lm .panel-hint{margin:18px 0 0;font-size:10.5px;color:var(--hint);line-height:1.5}
.lm .panel-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.graph-tooltip{background:#1F2328!important;color:#fff!important;border-radius:8px!important;padding:7px 10px!important;font:12px/1.45 var(--font)!important;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.graph-tooltip .gt-sub{color:#C5CAD3;font-size:11px}
/* 그래프 아래 노트 패널 */
.note-dock{margin-top:16px;padding:18px 22px 20px;border:1px solid var(--line);border-radius:16px;background:#fff;animation:dockin .25s ease;scroll-margin-top:72px}
@keyframes dockin{from{opacity:0;transform:translateY(8px)}}
.nd-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.nd-head h3{margin:0;font-size:16px}
.nd-kind{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent)}
.nd-kind i{width:11px;height:9px;border-radius:2px;background:var(--accent)}
.nd-kind.proj{color:var(--text)}.nd-kind.proj i{background:var(--text);width:9px}
.nd-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.nd-title{width:100%;border:0;border-bottom:1px solid transparent;font-size:20px;font-weight:800;padding:4px 0;outline:none;letter-spacing:-.02em;background:transparent}
.nd-title:focus{border-bottom-color:var(--line)}
.nd-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.nd-links .lbl{font-size:11px;color:var(--sub);margin-right:4px}
.pchip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:600;color:var(--sub)}
.pchip:hover{border-color:#C9CDD3;color:var(--text)}
.pchip.on{border-color:var(--accent);background:#EFF4FF;color:#1D4ED8}
.nd-body{display:block;width:100%;min-height:260px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.75;outline:none;resize:vertical;background:#FCFCFD}
.nd-body:focus{border-color:#9DB8F5;background:#fff}
.nd-meta{margin-top:8px;font-size:11px;color:var(--hint);display:flex;gap:14px}
.nd-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.nd-card{display:block;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;color:var(--text)}
.nd-card:hover{border-color:var(--accent)}
.nd-card b{display:flex;gap:7px;align-items:center;font-size:13px}
.nd-card b i{width:11px;height:9px;border-radius:2px;background:var(--accent);flex:none}
.nd-card .p{display:-webkit-box;margin:5px 0 6px;font-size:11.5px;color:var(--sub);line-height:1.5;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.nd-card small{color:var(--hint);font-size:10.5px}
.nd-empty{padding:20px;text-align:center;color:var(--sub);font-size:12px;border:1px dashed var(--line);border-radius:12px}
@media (max-width:1100px){
  .lm .workspace{grid-template-columns:1fr;height:auto}
  .lm .graph-shell{height:600px}
  .lm .lm-panel{border-left:0;border-top:1px solid var(--line);max-height:380px}
}
@media (max-width:768px){
  .lm .page-head{flex-direction:column;align-items:flex-start}
  .lm .sample-badge{display:none}
  .lm .graph-shell{height:620px}
  .lm .choice-grid{grid-template-columns:1fr}
  .lm .legend{display:none}
  .lm .graph-toolbar{flex-wrap:wrap}
}
/* ---------- portfolio ---------- */
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--sub)}
.crumb b{color:var(--text)}
.stepper{display:flex;align-items:center;gap:0}
.step{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--sub)}
.step .n{width:20px;height:20px;border-radius:50%;background:#E5E7EB;display:grid;place-items:center;font-size:11px}
.step.cur{color:var(--text)}
.step.cur .n,.step.done .n{background:var(--primary);color:#fff}
.step.done{color:var(--text)}
.step.done .n{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.step.done .n svg{width:11px;height:11px;stroke-width:3}
.step-line{width:64px;height:1px;background:var(--line);margin:0 12px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.type-card{position:relative;text-align:left;padding:20px;border-radius:12px;background:#fff;border:1.5px solid var(--line);min-height:240px}
.type-card.sel{background:#FAFAFB;border-color:var(--lav-line);box-shadow:0 0 0 1px var(--lav-line)}
.type-card .radio{position:absolute;right:16px;top:16px;width:22px;height:22px;border-radius:50%;border:1.5px solid #C9CDD3;display:grid;place-items:center;color:#fff}
.type-card.sel .radio{background:var(--primary);border-color:var(--primary)}
.type-card.sel .radio svg{width:13px;height:13px;stroke-width:3}
.type-card h3{margin:0;font-size:17px}
.type-card .d{color:var(--sub);font-size:12px;margin:4px 0 14px}
.type-card .body{display:flex;gap:18px}
.mini-doc{width:108px;height:128px;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(30,32,51,.12);padding:10px 8px;flex:none}
.mini-doc i{display:block;height:4px;border-radius:2px;background:#E5E7EB;margin-bottom:5px}
.mini-doc i.p{background:var(--primary);width:60%}
.mini-doc i.b{height:14px;background:#E5E7EB}
.mini-tbl{width:108px;height:128px;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(30,32,51,.12);padding:10px 8px;flex:none}
.mini-tbl .h{height:5px;background:#1F2328;width:70%;border-radius:2px;margin-bottom:8px}
.mini-tbl .g{display:grid;grid-template-columns:1fr 2fr 2fr;gap:2px}
.mini-tbl .g i{height:9px;background:#EEF0F2}
.mini-tbl .g i.h{background:#D1D5DB}
.type-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:11.5px}
.type-card li{display:flex;gap:10px;align-items:flex-start}
.type-card li .ck{width:20px;height:20px;border-radius:50%;background:var(--lav);color:var(--primary);display:grid;place-items:center;flex:none;margin-top:1px}
.type-card li .ck svg{width:11px;height:11px;stroke-width:3}
.type-card li b{display:block;font-size:12px}
.type-card li small{color:var(--sub);font-size:10.5px;line-height:1.4}
.pf-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin-top:18px}
.pf-foot .msg{display:flex;align-items:center;gap:12px;font-size:12px}
.pf-foot .msg svg.sp{width:28px;height:28px;color:var(--primary);flex:none}
.pf-foot .msg small{display:block;color:var(--sub);font-size:11px}
.pf-foot .btn.primary{height:42px;padding:0 24px;font-size:13px}
.legend-chips{display:flex;gap:10px;font-size:11px;color:var(--sub);align-items:center}
.pick{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;margin-top:12px;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.pick.sel{border-color:var(--lav-line);background:#FAFAFB}
.pick .cb{width:20px;height:20px;border-radius:5px;border:1.5px solid #C9CDD3;display:grid;place-items:center;color:#fff;flex:none;margin-top:2px}
.pick.sel .cb{background:var(--primary);border-color:var(--primary)}
.pick .cb svg{width:12px;height:12px;stroke-width:3}
.pick b{font-size:14px}
.pick .pp{color:var(--sub);font-size:11.5px;margin:2px 0 10px}
.draft-grid{display:grid;grid-template-columns:200px minmax(0,1fr) 262px;gap:16px;align-items:start}
.save-state{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:12px}
.save-state svg{width:13px;height:13px;color:var(--sub)}
.ord-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:9px 11px;font-size:13px;font-weight:600;margin-bottom:4px}
.ord-item small{display:block;color:var(--primary);font-weight:500;font-size:11px}
.ord-item.sel{background:var(--lav);color:var(--primary)}
.ord-item .no{margin-right:8px}
.ord-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ord-btns .btn{height:32px;font-size:11.5px;white-space:nowrap;padding:0 8px}
.ord-note{font-size:10.5px;color:var(--sub);text-align:center;line-height:1.5;margin-top:10px}
.edit-title{margin:0;font-size:17px}
.edit-meta{color:var(--sub);font-size:11.5px;margin:4px 0 14px}
.sec{margin-bottom:14px}
.sec h4{margin:0 0 2px;color:var(--primary);font-size:12.5px}
.sec .g{color:var(--hint);font-size:11px;margin-bottom:5px}
.sec .ta{position:relative}
.sec textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px 24px;font-size:12.5px;line-height:1.65;outline:none;resize:none;min-height:96px;background:#fff}
.sec textarea:focus{background:#FAFAFB;border-color:var(--lav-line)}
.sec .cnt{position:absolute;right:10px;bottom:7px;font-size:10.5px;color:var(--hint)}
.ai-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:12.5px;font-weight:600;margin-bottom:8px}
.ai-btn:hover{border-color:var(--lav-line);background:#FAFAFB}
.ai-btn svg:first-child{color:var(--primary)}
.ai-btn svg:last-child{margin-left:auto;color:var(--hint)}
.diff-card{border:1px solid var(--lav-line);background:#FAFAFB;border-radius:10px;padding:12px;margin:10px 0;font-size:12px;line-height:1.7}
.diff-card .dh{font-weight:700;color:var(--primary);font-size:11.5px;margin-bottom:6px;display:flex;justify-content:space-between}
.diff-card del{background:#FDE7E8;color:#B3363B;text-decoration:line-through}
.diff-card ins{background:#DDF5E8;color:#1D7A50;text-decoration:none}
.diff-card .nochg{color:var(--sub)}
.ref-row{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid #F1F2F4;padding:9px 0;font-size:12px;text-align:left}
.ref-row:hover{color:var(--primary)}
.ref-row .ico{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--sub)}
.ref-row svg:last-child{margin-left:auto;color:var(--hint)}
.alt-table{width:100%;border-collapse:collapse;font-size:12px}
.alt-table th{background:#F3F4F6;font-weight:700;color:var(--sub);padding:8px;border:1px solid var(--line);font-size:11.5px}
.alt-table td{border:1px solid var(--line);padding:4px;vertical-align:top}
.alt-table input,.alt-table textarea{width:100%;border:0;outline:none;background:transparent;padding:6px;font-size:12px;resize:none;line-height:1.5}
.alt-table textarea{min-height:56px}
.alt-table td.no{text-align:center;color:var(--sub);width:40px;padding-top:10px}
.alt-table .cnt{font-size:10.5px;color:var(--hint);text-align:right;padding:0 6px 3px}
.alt-table .cnt.over{color:var(--danger);font-weight:700}
.check-list{margin-top:14px;padding:14px;background:#FAFAFB;border-radius:10px;border:1px dashed var(--lav-line)}
.check-list h5{margin:0 0 8px;font-size:12.5px}
.check-list label{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px;cursor:pointer}
.check-list input{accent-color:var(--primary);width:16px;height:16px}
.print-sheet{padding:10px 6px;color:#111;font-size:12.5px}
.print-sheet h2{margin:0 0 2px;font-size:22px}
.print-sheet .sh{color:#666;margin-bottom:16px}
.print-sheet .pj{border-top:2px solid #222;padding:12px 0}
.print-sheet .pj h4{margin:0 0 2px;font-size:15px}
.print-sheet dl{display:grid;grid-template-columns:60px 1fr;gap:6px 10px;margin:8px 0 0}
.print-sheet dt{font-weight:700;color:#444}
.print-sheet dd{margin:0;white-space:pre-wrap;line-height:1.6}
.print-sheet table{width:100%;border-collapse:collapse;margin-top:10px}
.print-sheet th,.print-sheet td{border:1px solid #444;padding:7px;font-size:12px;vertical-align:top}
.print-sheet th{background:#eee}

.coach-empty{display:grid;place-items:center;text-align:center;min-height:380px;color:var(--sub)}
.coach-empty h2{color:var(--text);margin:10px 0 4px}
.coach-empty svg.sp{width:56px;height:56px;color:var(--primary)}

.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;z-index:5;border-radius:12px}
.spinner{width:26px;height:26px;border:3px solid #E5E7EB;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn .spinner{width:14px;height:14px;border-width:2px}
.btn.primary .spinner{border-color:rgba(255,255,255,.4);border-top-color:#fff}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .proj-grid{grid-template-columns:190px minmax(0,1fr)}
  .proj-grid .col-right{grid-column:1/-1}
  .draft-grid{grid-template-columns:190px minmax(0,1fr)}
  .draft-grid .col-right{grid-column:1/-1}
}
@media (max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:8px;position:sticky;top:0;z-index:40}
  .logo{padding:0 6px 0 0}.logo small{display:none}
  .nav{flex-direction:row}.nav a{white-space:nowrap;padding:8px 10px}
  .side-foot{display:none}
  .topbar{top:52px;padding:0 12px;gap:8px}
  .search{width:auto;flex:1}
  .user-btn span.nm{display:none}
  .page{padding:18px 14px 40px}
  .proj-grid,.draft-grid{grid-template-columns:1fr}
  .type-grid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .pf-top{flex-direction:column;align-items:flex-start}
  .step-line{width:20px;margin:0 6px}
  .learn-head .quote-top{display:none}
  .graph-wrap{height:340px}
  .pf-foot{flex-direction:column;align-items:stretch}
}

/* ---------- print ---------- */
@media print{
  body.printing .app,body.printing #toasts{display:none!important}
  body.printing .overlay{position:static;background:none;padding:0;display:block}
  body.printing .modal{box-shadow:none;max-height:none;width:100%;padding:0;overflow:visible}
  body.printing .modal .no-print{display:none!important}
  body{background:#fff}
}

    // '2026-03' | '2026-03-02' -> '2026.03'
    ym: function (s) { return s ? s.slice(0, 7).replace('-', '.') : ''; },
    ymd: function (s) { return s ? s.slice(0, 10).replace(/-/g, '.') : ''; },
    period: function (p) {
      var d = p.dates || {};
      if (!d.start && !d.end) return '기간 미입력';
      return RC.u.ym(d.start) + ' – ' + RC.u.ym(d.end);
    },
    noteDate: function (iso) {
      var d = new Date(iso); if (isNaN(d)) return '';
      var h = d.getHours(), ap = h < 12 ? '오전' : '오후', h12 = h % 12 || 12;
      return d.getFullYear() + '.' + RC.u.pad(d.getMonth() + 1) + '.' + RC.u.pad(d.getDate()) + ' ' + ap + ' ' + h12 + ':' + RC.u.pad(d.getMinutes());
    },
    fmtSize: function (b) { return b > 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB'; },
    sleep: function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  };

  RC.state = null;
  var listeners = [];

  RC.store = {
    load: function () {
      var s = null;
      try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
      if (!s || s.v !== 1) { s = RC.seed(); }
      // 연결 그래프 노트 (ui.career = 탐색 위치와 별도). 기존 저장 데이터에는 빈 목록만 추가한다.
      if (!Array.isArray(s.graphNotes)) s.graphNotes = [];
      RC.state = s;
      RC.store.save();
      return s;
    },
    save: function () {
      try { localStorage.setItem(KEY, JSON.stringify(RC.state)); return true; }
      catch (e) { if (RC.toast) RC.toast('저장 공간이 부족해요. 큰 이미지는 줄여서 올려주세요.'); return false; }
    },
    reset: function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      RC.state = RC.seed();
      RC.store.save();
    },
    project: function (id) { return RC.state.projects.filter(function (p) { return p.id === id; })[0]; },
    exp: function (id) { return RC.state.experiences.filter(function (e) { return e.id === id; })[0]; },
    expsOf: function (pid) { return RC.state.experiences.filter(function (e) { return e.projectId === pid; }); },
    mainExp: function (pid) { return RC.state.experiences.filter(function (e) { return e.projectId === pid && e.main; })[0]; },
    onChange: function (fn) { listeners.push(fn); },
    emit: function () { RC.store.save(); listeners.forEach(function (f) { f(); }); }
  };
})(window.RC);

<script>
/*
 * RE:Cord — AI interface (rule-based Mock, deterministic).
 *
 * Every public function returns a Promise (simulated 0.6~1.2s latency) so the UI code is
 * already async-ready. To switch to a real model, replace the body of each function with a
 * fetch() to a Next.js Route Handler (e.g. POST /api/ai/analyze) that calls the LLM server-side.
 * NEVER put an API key in the frontend. The JSON shapes below are the contract.
 *
 *  analyzeProject(project) -> {
 *      items: { period|role|problem|process|result|proof|reflection : { status:'ok'|'missing', evidence:[noteId] } },
 *      at: ISOString }
 *  suggestGuides(project, analysis) -> [ { key, question, hint, action:'upload'|'answer'|'edit', cta } ]  (max 2)
 *  findRelations(expId, experiences, existingRelations) -> [ { a, b, type, evidence, score, confidence:'high'|'mid' } ]  (Top-5)
 *        type: '같은 관심사' | '같은 역할' | '문제→해결 흐름'.  0.5+ => high (auto), 0.3~0.5 => mid (student must confirm)
 *  extractExperience(project) -> { role, activity, problem, process, result, reflection, interests:[string] }
 *        (Experience structuring; student reviews before it is saved. Empty string = nothing in the records; never invented.)
 *  generateDraft(project) -> { problem, role, result }   (assembled only from saved experience elements)
 *  refineText(mode:'concise'|'role'|'rewrite', text) -> { text, changed:boolean }
 */
window.RC = window.RC || {};
(function (RC) {
  var KEYS = ['period', 'role', 'problem', 'process', 'result', 'proof', 'reflection'];
  var LABEL = { period: '기간', role: '역할', problem: '문제', process: '과정', result: '결과', proof: '증빙', reflection: '회고' };
  var KW = {
    role: ['내가', '제가', '맡', '담당', '역할'],
    problem: ['문제', '불편', '어려', '왜', '계기'],
    process: ['인터뷰', '조사', '관찰', '시도', '수정', '제작'],
    result: ['완성', '결과', '시안', '발표'],
    reflection: ['배운', '배웠', '느낀', '다음엔', '아쉬', '개선']
  };
  var INTEREST_KW = {
    '접근성': ['접근', '휠체어', '출입구', '통로'],
    '사용자 경험': ['사용자', '불편', '인터뷰', '이용'],
    '지역 문제': ['지역', '주민', '동네', '골목', '쓰레기', '분리수거']
  };

  function hit(text, list) { return list.filter(function (k) { return text.indexOf(k) >= 0; }); }
  function delay(key) {
    var h = 0, s = String(key || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 600;
    return 600 + h;
  }
  function sentences(t) {
    return String(t || '').split(/(?<=[.!?。])\s+|\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  /* ---------- 1. record checklist ---------- */
  function analyzeSync(p) {
    var items = {}, notes = p.notes || [];
    function ev(fn) { return notes.filter(fn).map(function (n) { return n.id; }); }
    var d = p.dates || {};
    items.period = { status: d.start && d.end ? 'ok' : 'missing', evidence: [] };
    // a short answer typed into a guide card (note.answerKey) counts for that item
    ['role', 'problem', 'reflection'].forEach(function (k) {
      var e = ev(function (n) { return n.answerKey === k || hit(n.text || '', KW[k]).length > 0; });
      items[k] = { status: e.length ? 'ok' : 'missing', evidence: e };
    });
    var kws = {};
    notes.forEach(function (n) { hit(n.text || '', KW.process).forEach(function (k) { kws[k] = 1; }); });
    var pe = ev(function (n) { return n.answerKey === 'process' || hit(n.text || '', KW.process).length > 0; });
    items.process = { status: Object.keys(kws).length >= 2 || notes.some(function (n) { return n.answerKey === 'process'; }) ? 'ok' : 'missing', evidence: pe };
    var re = ev(function (n) { return n.tag === 'result' || hit(n.text || '', KW.result).length > 0; });
    items.result = { status: re.length ? 'ok' : 'missing', evidence: re };
    var pr = ev(function (n) { return n.type === 'photo' || n.type === 'file' || n.type === 'link'; });
    items.proof = { status: pr.length ? 'ok' : 'missing', evidence: pr };
    return { items: items, at: new Date().toISOString() };
  }

  /* ---------- 2. guide questions ---------- */
  var Q = {
    period: ['언제부터 언제까지?', '프로젝트 기간을 입력해요.', 'edit', '기간 입력하기'],
    role: ['직접 맡은 부분은?', '내가 한 일을 한두 문장으로 남겨요.', 'answer', '짧게 답하기'],
    problem: ['왜 시작했나요?', '시작한 계기나 불편을 남겨요.', 'answer', '짧게 답하기'],
    process: ['어떻게 해결했나요?', '시도하고 수정한 과정을 남겨요.', 'answer', '짧게 답하기'],
    result: ['완성한 결과물이 있나요?', '지도 시안이나 발표자료를 추가해요.', 'upload', '자료 추가하기'],
    proof: ['당시 자료가 있나요?', '사진·문서·링크를 추가해요.', 'upload', '자료 추가하기'],
    reflection: ['무엇을 배웠나요?', '배운 점과 다음 개선점을 남겨요.', 'answer', '짧게 답하기']
  };
  function suggestSync(p, a) {
    var out = [];
    KEYS.forEach(function (k) {
      var missing = a.items[k].status === 'missing';
      // result recorded only through text (no tagged deliverable note) -> still ask for the deliverable
      var weak = k === 'result' && !missing && !(p.notes || []).some(function (n) { return n.tag === 'result'; });
      if (missing || weak) out.push({ key: k, question: Q[k][0], hint: Q[k][1], action: Q[k][2], cta: Q[k][3] });
    });
    return out.slice(0, 2);
  }

  /* ---------- 3. relations ---------- */
  function jaccard(a, b) {
    var A = {}, B = {}, inter = [], i;
    a.forEach(function (x) { A[x] = 1; }); b.forEach(function (x) { B[x] = 1; });
    Object.keys(A).forEach(function (k) { if (B[k]) inter.push(k); });
    var uni = Object.keys(A).length + Object.keys(B).length - inter.length;
    return { score: uni ? inter.length / uni : 0, shared: inter };
  }
  function relationsSync(expId, exps, existing) {
    var me = exps.filter(function (e) { return e.id === expId; })[0];
    if (!me) return [];
    var interests = (RC.state && RC.state.interests) || [];
    var out = [];
    exps.forEach(function (o) {
      if (o.id === me.id) return;
      if (existing.some(function (r) { return (r.a === me.id && r.b === o.id) || (r.a === o.id && r.b === me.id); })) return;
      var j = jaccard(me.tags || [], o.tags || []);
      if (j.score < 0.3) return;
      var sharedInterest = j.shared.filter(function (t) { return interests.indexOf(t) >= 0; });
      var type = sharedInterest.length ? '같은 관심사'
        : (hit(me.role || '', (o.role || '').split(/[ ·\/]+/).filter(function (w) { return w.length > 1; })).length ? '같은 역할' : '문제→해결 흐름');
      var rec = (o.records || []).concat(me.records || []).slice(0, 2).map(function (r) { return r.name; });
      out.push({
        a: me.id, b: o.id, type: type, score: Math.round(j.score * 100) / 100,
        evidence: '공통 키워드: ' + j.shared.join(', ') + (rec.length ? ' · 근거 기록: ' + rec.join(', ') : ''),
        confidence: j.score >= 0.5 ? 'high' : 'mid'
      });
    });
    out.sort(function (x, y) { return y.score - x.score; });
    return out.slice(0, 5);
  }

  /* ---------- 4. experience extraction ---------- */
  function extractSync(p) {
    var all = [];
    (p.notes || []).forEach(function (n) { sentences(n.text).forEach(function (s) { all.push({ s: s, n: n }); }); });
    function pick(list) { var f = all.filter(function (x) { return hit(x.s, list).length; })[0]; return f ? f.s : ''; }
    var text = all.map(function (x) { return x.s; }).join(' ');
    var procKw = hit(text, KW.process);
    var interests = [];
    var known = (RC.state && RC.state.interests) || Object.keys(INTEREST_KW);
    known.forEach(function (name) {
      var words = INTEREST_KW[name] || [name];
      if (hit(text, words).length || text.indexOf(name) >= 0) interests.push(name);
    });
    return {
      role: pick(KW.role), activity: procKw.join(' / '),
      problem: pick(KW.problem), process: pick(KW.process),
      result: pick(KW.result), reflection: pick(KW.reflection), interests: interests
    };
  }

  /* ---------- 5. draft ---------- */
  function draftSync(p) {
    var e = p.experience || {};
    if (e.draft) return { problem: e.draft.problem, role: e.draft.role, result: e.draft.result };
    function end(s) { s = (s || '').trim(); return s && !/[.!?]$/.test(s) ? s + '.' : s; }
    // a role stored as a phrase ("현장 조사 · 인터뷰") becomes a plain sentence; a stored sentence is kept as is
    function roleSentence(r) { r = (r || '').trim(); if (!r) return ''; return /[다요][.!]?$/.test(r) ? end(r) : '맡은 역할은 ' + r + '입니다.'; }
    var result = [end(e.result), end(e.reflection)].filter(Boolean).join(' ');
    return { problem: end(e.problem), role: [end(e.process), roleSentence(e.role)].filter(Boolean).join(' '), result: result };
  }

  /* ---------- 6. text refine ---------- */
  var FILLERS = ['정말 ', '매우 ', '아주 ', '직접 ', '함께 ', '다양한 ', '또한 ', '그리고 ', '그래서 ', '이번 경험을 통해 ', '이번 ', '계속 ', '실제 '];
  function refineSync(mode, text) {
    var src = String(text || '').trim();
    if (!src) return { text: src, changed: false };
    var out = src, ss;
    if (mode === 'concise') {
      FILLERS.forEach(function (f) { out = out.split(f).join(''); });
      out = out.replace(/해,\s*/g, '했습니다. ').replace(/\s{2,}/g, ' ');
    } else if (mode === 'role') {
      ss = sentences(src);
      var VERBS = ['살피', '인터뷰', '정리', '구성', '제작', '파악', '담당', '맡', '만들', '조사', '관찰'];
      var mine = ss.filter(function (s) { return hit(s, VERBS).length; });
      var rest = ss.filter(function (s) { return mine.indexOf(s) < 0; });
      mine = mine.map(function (s, i) { return i > 0 || /^(저는|제가|나는)/.test(s) ? s : '저는 ' + s; });
      out = mine.concat(rest).join(' ');
    } else {
      ss = sentences(src);
      out = (ss.length > 1 ? ss.slice().reverse() : ss).join(' ').replace(/했습니다/g, '하였습니다').replace(/습니다/g, '습니다');
      if (out === src) out = src.replace(/습니다/g, '어요');
    }
    out = out.trim();
    return { text: out, changed: out !== src };
  }

  function wrap(fn, key) {
    return function () {
      var a = arguments;
      return RC.u.sleep(delay(key || JSON.stringify(a[0] && a[0].id || a[0] || ''))).then(function () { return fn.apply(null, a); });
    };
  }

  RC.ai = {
    KEYS: KEYS, LABEL: LABEL,
    analyzeSync: analyzeSync, suggestSync: suggestSync,
    analyzeProject: function (p) { return RC.u.sleep(500 + delay(p.id) / 4).then(function () { return analyzeSync(p); }); },
    suggestGuides: function (p, a) { return RC.u.sleep(100).then(function () { return suggestSync(p, a || analyzeSync(p)); }); },
    findRelations: wrap(relationsSync, 'rel'),
    extractExperience: function (p) { return RC.u.sleep(delay(p.id) + 300).then(function () { return extractSync(p); }); },
    generateDraft: function (p) { return RC.u.sleep(delay(p.id)).then(function () { return draftSync(p); }); },
    draftSync: draftSync,
    refineText: function (mode, text) { return RC.u.sleep(delay(mode + text)).then(function () { return refineSync(mode, text); }); }
  };
  // findRelations takes positional args; wrap() above keys off the first arg (expId string)
  RC.ai.findRelations = function (expId, exps, existing) {
    return RC.u.sleep(delay(expId)).then(function () { return relationsSync(expId, exps, existing || []); });
  };
})(window.RC);

<script>
/* UI helpers: toast, modal, confirm, popup menu */
window.RC = window.RC || {};
(function (RC) {
  var esc = function (s) { return RC.u.esc(s); };

  RC.toast = function (msg) {
    var box = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    box.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 320); }, 2600);
  };

  var stack = [];
  RC.modal = function (opts) {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      (opts.title ? '<h3>' + esc(opts.title) + '</h3>' : '') + opts.html + '</div>';
    var down = false;
    ov.addEventListener('mousedown', function (e) { down = e.target === ov; });
    ov.addEventListener('click', function (e) { if (e.target === ov && down) api.close(); });
    document.getElementById('modal-root').appendChild(ov);
    var api = {
      el: ov.firstChild, overlay: ov,
      $: function (sel) { return ov.querySelector(sel); },
      close: function () {
        if (!ov.parentNode) return;
        ov.remove(); stack = stack.filter(function (m) { return m !== api; });
        document.body.classList.remove('printing');
        if (opts.onClose) opts.onClose();
      }
    };
    stack.push(api);
    var first = ov.querySelector('input,textarea,select');
    if (first && !opts.noFocus) first.focus();
    if (opts.onMount) opts.onMount(api);
    return api;
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stack.length) stack[stack.length - 1].close();
  });

  RC.confirm = function (msg, okLabel, danger) {
    return new Promise(function (res) {
      var done = false;
      var m = RC.modal({
        html: '<p style="margin:4px 0 18px;line-height:1.6">' + esc(msg) + '</p><div class="modal-actions">' +
          '<button class="btn" data-x="0">취소</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-x="1">' + esc(okLabel || '확인') + '</button></div>',
        noFocus: true,
        onClose: function () { if (!done) { done = true; res(false); } }
      });
      m.el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-x]'); if (!b) return;
        done = true; m.close(); res(b.getAttribute('data-x') === '1');
      });
    });
  };

  // Popup menu anchored to an element. items: [{label, icon, danger, fn}]
  RC.popMenu = function (anchor, items) {
    RC.closeMenus();
    var r = anchor.getBoundingClientRect();
    var m = document.createElement('div');
    m.className = 'menu pop-menu';
    m.style.cssText = 'position:fixed;z-index:120;top:' + (r.bottom + 4) + 'px;left:' + Math.max(8, Math.min(window.innerWidth - 180, r.right - 160)) + 'px';
    m.innerHTML = items.map(function (it, i) {
      return '<button data-i="' + i + '" class="' + (it.danger ? 'danger' : '') + '">' + (it.icon ? RC.icon(it.icon) : '') + esc(it.label) + '</button>';
    }).join('');
    m.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      RC.closeMenus(); items[+b.getAttribute('data-i')].fn();
    });
    document.body.appendChild(m);
  };
  RC.closeMenus = function () {
    Array.prototype.forEach.call(document.querySelectorAll('.pop-menu'), function (n) { n.remove(); });
  };
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.pop-menu') && !e.target.closest('[data-menu]')) RC.closeMenus();
  });

  RC.go = function (hash) { if (location.hash === hash) window.dispatchEvent(new Event('hashchange')); else location.hash = hash; };

  RC.noteIcon = function (n) {
    if (n.type === 'photo') return 'image';
    if (n.type === 'link') return 'link';
    if (n.type === 'memo') return 'pen';
    return 'file';
  };
  RC.noteTypeLabel = function (n) {
    return { photo: '사진', link: '링크', memo: '메모' }[n.type] || (n.ext || '파일');
  };

  // Show note content in a modal (memo/txt body, image zoom, link)
  RC.viewNote = function (n) {
    var body;
    if (n.type === 'photo' && n.dataUrl) body = '<img class="img-zoom" src="' + n.dataUrl + '" alt="' + esc(n.name) + '">';
    else if (n.text) body = '<div class="note-body">' + esc(n.text) + '</div>';
    else body = '<div class="empty-note">미리볼 본문이 없는 자료예요 (' + esc(RC.noteTypeLabel(n)) + (n.size ? ' · ' + RC.u.fmtSize(n.size) : '') + ').</div>';
    if (n.type === 'link' && n.url) body += '<p class="hint" style="margin-top:8px">링크: ' + esc(n.url) + '</p>';
    var m = RC.modal({ title: n.name, wide: n.type === 'photo' && !!n.dataUrl,
      html: body + '<div class="modal-actions"><button class="btn primary" data-close>닫기</button></div>', noFocus: true });
    m.el.querySelector('[data-close]').onclick = m.close;
  };
})(window.RC);

</script>
<script>

  function ui() { return RC.state.ui; }
  function cur() { return RC.store.project(ui().selectedProject) || RC.state.projects[0]; }

  /* ---------- render ---------- */
  function chipsHtml(p) {
    return RC.ai.KEYS.map(function (k) {
      var ok = p.analysis.items[k].status === 'ok';
      var cls = 'chip' + (ok ? ' on' : '') + (analyzing[p.id] ? ' shimmer' : '') + (popKeys.indexOf(k) >= 0 && ok ? ' pop' : '');
      return '<span class="' + cls + '">' + (ok ? '✓ ' : '— ') + RC.ai.LABEL[k] + '</span>';
    }).join('');
  }

  function guideHtml(g, extra) {
    var open = answerOpen === g.key;
    return '<div class="guide' + (extra || '') + '" data-gkey="' + g.key + '"><div class="gi">' + icon(g.action === 'upload' ? 'file' : 'bulb') + '</div><div style="flex:1;min-width:0">' +
      '<b>' + esc(g.question) + '</b><p>' + esc(g.hint) + '</p>' +
      (open
        ? '<textarea data-in="answer" placeholder="짧게 적어도 괜찮아요."></textarea><div class="gbtns"><button class="btn primary sm" data-act="answer-save" data-key="' + g.key + '">저장</button><button class="btn sm" data-act="answer-cancel">취소</button></div>'
        : '<button class="link" data-act="guide-' + g.action + '" data-key="' + g.key + '">' + esc(g.cta) + ' ' + icon('chevR') + '</button>') +
      '</div></div>';
  }

  function rightHtml(p) {
    var guides = RC.ai.suggestSync(p, p.analysis);
    var gh = guides.map(function (g) { return guideHtml(g, enterKeys.indexOf(g.key) >= 0 ? ' enter' : ''); }).join('');
    leaving.forEach(function (g) { gh += guideHtml(g, ' is-leaving'); });
    if (!guides.length && !leaving.length) gh = '<div class="all-good">' + icon('check') + '기록이 충분해요. 새 자료를 올리면 다시 확인해요.</div>';
    return '<div class="card panel"><div class="right-title">' + icon('bulb') + '보완 제안 <span class="badge-ai">샘플 규칙</span></div>' +
      '<div id="guides">' + gh + '</div>' +
      '<h2 style="margin:20px 0 10px;font-size:13px">기록 확인</h2>' +
      '<div class="chips" id="chips">' + chipsHtml(p) + '</div></div>';
  }

  function notesHtml(p, list) {
    if (!list.length) return '<div class="empty-note">아직 자료가 없어요.</div>';
    return list.map(function (n) {
      var ico = n.type === 'photo' && n.dataUrl ? '<img src="' + n.dataUrl + '" alt="">' : icon(RC.noteIcon(n));
      return '<div class="note" data-note="' + n.id + '"><div class="ico">' + ico + '</div><div class="nm"><b>' + esc(n.name) +
        (n.tag === 'result' ? '<span class="tag-result">결과물</span>' : '') + '</b><small>' + RC.u.noteDate(n.createdAt) + ' · ' + esc(RC.state.user.name) + '</small></div>' +
        '<span class="type">' + esc(RC.noteTypeLabel(n)) + '</span>' +
        '<button class="icon-btn" data-menu data-act="note-menu" data-id="' + n.id + '" aria-label="메뉴">' + icon('more') + '</button></div>';
    }).join('');
  }

  function filesTab(p) {
    return '<div class="sec-head"><h3>기록 자료</h3><span style="display:flex;gap:6px"><button class="btn ghost" data-act="add-sample">샘플 자료 넣기</button><button class="btn ghost" data-act="add-note">링크 · 메모</button></span></div>' +
      '<div class="dropzone" id="dz" data-act="pick-file">' + icon('upload') + '<b>파일 끌어놓기 · 선택</b><div class="t2">문서 · 사진 · 링크 · 메모</div></div>' +
      '<div style="margin-top:12px">' + notesHtml(p, p.notes.slice().sort(function (a, b) { return b.createdAt < a.createdAt ? -1 : 1; })) + '</div>';
  }

  var FIELDS = [['role', '역할'], ['activity', '활동'], ['problem', '문제'], ['process', '과정'], ['result', '결과'], ['reflection', '회고'], ['interests', '관심 분야']];

      '<button class="btn primary" data-act="exp-save"' + (d ? '' : ' disabled') + '>확인하고 저장</button></div>';
    if (p.experience && p.experience.confirmed && !d) html += '<p class="hint" style="margin-top:10px">✓ 확인된 경험이에요.</p>';
    return html;
  }

  function listTab(p, kind) {
    var list = p.notes.filter(function (n) { return kind === 'result' ? n.tag === 'result' : n.tag !== 'result'; })

    return head + (list.length ? notesHtml(p, list) : '<div class="empty-note">' + (kind === 'result' ? '결과물로 표시된 자료가 없어요. 자료 옆 ⋮ 메뉴에서 "결과물로 표시"할 수 있어요.' : '진행 기록이 없어요.') + '</div>');

  function gnotesOf(pid) { return (RC.state.graphNotes || []).filter(function (n) { return (n.projectIds || []).indexOf(pid) >= 0; }); }

    root.innerHTML = '<div class="page"><div class="page-head"><div><h1 class="title">프로젝트 관리</h1><p class="subtitle">프로젝트를 고르고 기록을 모아요.</p></div></div>' +
      '<div class="proj-grid"><div class="card panel"><div class="proj-list-head"><h2>프로젝트 목록</h2><span class="count">' + s.projects.length + '</span></div>' +
      '<button class="btn primary block" data-act="new-project">' + icon('plus') + ' 새 프로젝트</button>' +
      s.projects.map(function (q) {
        var gc = gnotesOf(q.id).length;
        return '<button class="proj-item' + (q.id === p.id ? ' sel' : '') + '" data-act="select-project" data-id="' + q.id + '"><span><b>' + esc(q.shortName === '상점 접근성' ? '상점 접근성 개선' : q.shortName) + '</b><small>' + q.status + ' · 자료 ' + q.notes.length + (gc ? ' · 노트 ' + gc : '') + '</small></span>' + icon('chevR') + '</button>';
      }).join('') + '</div>' +
      '<div class="card panel"><div class="detail-head"><div><h2>' + esc(p.name) + '</h2><div class="period">' + RC.u.ym(p.dates.start).replace('.', '.') + (p.dates.end ? '–' + RC.u.ym(p.dates.end) : '') + '</div></div><button class="btn ghost" data-act="edit-project">수정</button></div>' +
      '<div class="tabs">' + tabs.map(function (t) { return '<button class="' + (tab === t[0] ? 'on' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' + body + '</div>' +
      '<div class="col-right">' + rightHtml(p) + '</div></div></div>';
    mount();
  };

  function mount() {
    var dz = root.querySelector('#dz');
    if (dz) {
      ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
      dz.addEventListener('drop', function (e) { forceResult = false; if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, false); });
    }
    // leaving guides animate out
    var going = root.querySelectorAll('.guide.is-leaving');
    if (going.length) {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        Array.prototype.forEach.call(going, function (n) { n.classList.add('leave'); });
      }); });
      setTimeout(function () {
        Array.prototype.forEach.call(going, function (n) { n.remove(); });
        var box = root.querySelector('#guides');
        if (box && !box.querySelector('.guide')) box.innerHTML = '<div class="all-good">' + icon('check') + '기록이 충분해요. 새 자료를 올리면 다시 확인해요.</div>';
      }, 650);
    }
    leaving = []; popKeys = []; enterKeys = [];
    var f = ui().flashNote;
    if (f) {
      var nn = root.querySelector('[data-note="' + f + '"]');
      if (nn) { nn.classList.add('flash'); nn.scrollIntoView({ block: 'center' }); }
      ui().flashNote = null;
    }
  }

  /* ---------- re-analysis (demo key moment) ---------- */
  function refresh(p, quiet) {
    var oldA = p.analysis, oldGuides = RC.ai.suggestSync(p, oldA);
    analyzing[p.id] = true; if (RC.cur === V) V.render();
    return RC.ai.analyzeProject(p).then(function (a) {
      delete analyzing[p.id];
      popKeys = RC.ai.KEYS.filter(function (k) { return a.items[k].status === 'ok' && oldA.items[k].status !== 'ok'; });
      p.analysis = a;
      var ng = RC.ai.suggestSync(p, a);
      leaving = oldGuides.filter(function (g) { return !ng.some(function (n) { return n.key === g.key; }); });
      enterKeys = ng.filter(function (g) { return !oldGuides.some(function (o) { return o.key === g.key; }); }).map(function (g) { return g.key; });
      RC.store.emit();
      if (RC.cur === V) V.render();
    });
  }

  /* ---------- uploads ---------- */
  function readText(file) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(String(r.result).slice(0, 20000)); }; r.onerror = function () { res(''); }; r.readAsText(file); }); }
  function shrinkImage(file) {
    return new Promise(function (res) {
      var r = new FileReader();
      r.onerror = function () { res(''); };
      r.onload = function () {
        var img = new Image();
        img.onerror = function () { res(''); };
        img.onload = function () {
          var max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height)), q = 0.82, url;
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          url = c.toDataURL('image/jpeg', q);
          while (url.length * 0.75 > 1048576 && q > 0.3) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
          res(url);
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  function uploadFiles(files, asResult) {
    var p = cur(), list = Array.prototype.slice.call(files);
    var resultMissing = p.analysis.items.result.status === 'missing' || !p.notes.some(function (n) { return n.tag === 'result'; });
    return Promise.all(list.map(function (f) {
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      var base = { id: RC.u.uid('n'), name: f.name, size: f.size, createdAt: new Date().toISOString(), tag: '', text: '' };
      var isImg = /^image\//.test(f.type) || /^(png|jpe?g|gif|webp)$/.test(ext);
      var isTxt = ext === 'txt' || ext === 'md';
      var job;
      if (isImg) job = shrinkImage(f).then(function (u) { base.type = 'photo'; base.dataUrl = u; });
      else if (isTxt) job = readText(f).then(function (t) { base.type = 'file'; base.ext = ext.toUpperCase(); base.text = t; });
      else { base.type = 'file'; base.ext = (ext || '파일').toUpperCase(); job = Promise.resolve(); }
      return job.then(function () {
        if (asResult || (resultMissing && (isImg || /^(pdf|pptx?|key)$/.test(ext)))) base.tag = 'result';
        p.notes.push(base);
      });
    })).then(function () {
      RC.store.emit();
      RC.toast('자료가 추가되었어요 · 기록 확인을 다시 했어요');
      return refresh(p);
    });
  }
  function ensureInput() {
    if (fileInput) return;
    fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.style.display = 'none';
    fileInput.addEventListener('change', function () { if (fileInput.files.length) uploadFiles(fileInput.files, forceResult); fileInput.value = ''; forceResult = false; });
    document.body.appendChild(fileInput);
  }

  /* ---------- actions ---------- */
  function monthToDate(m, end) {
    if (!m) return '';
    if (!end) return m + '-01';
    var y = +m.slice(0, 4), mo = +m.slice(5, 7), last = new Date(y, mo, 0).getDate();
    return m + '-' + RC.u.pad(last);
  }
  function projectModal(p) {
    var isNew = !p;
    var d = p ? p.dates : {};
    var m = RC.modal({
      title: isNew ? '새 프로젝트' : '프로젝트 수정',
      html: '<div class="field"><label>프로젝트 이름</label><input id="pm-name" value="' + esc(p ? p.name : '') + '" placeholder="예: 우리 동네 지도 만들기"></div>' +
        '<div class="row2"><div class="field"><label>시작</label><input type="month" id="pm-s" value="' + esc((d.start || '').slice(0, 7)) + '"></div><div class="field"><label>종료</label><input type="month" id="pm-e" value="' + esc((d.end || '').slice(0, 7)) + '"></div></div>' +
        '<div class="row2"><div class="field"><label>주제</label><input id="pm-topic" value="' + esc(p ? p.topic : '') + '" placeholder="예: 접근성 안내 지도"></div>' +
        '<div class="field"><label>상태</label><select id="pm-st"><option' + (p && p.status === '진행 중' || isNew ? ' selected' : '') + '>진행 중</option><option' + (p && p.status === '완료' ? ' selected' : '') + '>완료</option></select></div></div>' +
        '<div class="modal-actions">' + (isNew ? '' : '<button class="btn danger left" data-del>삭제</button>') + '<button class="btn" data-cancel>취소</button><button class="btn primary" data-ok>' + (isNew ? '만들기' : '저장') + '</button></div>'
    });
    m.$('[data-cancel]').onclick = m.close;
    m.$('[data-ok]').onclick = function () {
      var name = m.$('#pm-name').value.trim();
      if (!name) { RC.toast('프로젝트 이름을 입력해 주세요'); return; }
      var s = m.$('#pm-s').value, e = m.$('#pm-e').value;
      if (s && e && e < s) { RC.toast('종료가 시작보다 빠를 수 없어요'); return; }
      var dates = { start: monthToDate(s, false), end: monthToDate(e, true) };
      if (isNew) {
        var np = { id: RC.u.uid('p'), name: name, shortName: name.replace(/\s*(프로젝트)$/, ''), topic: m.$('#pm-topic').value.trim(), dates: dates, status: m.$('#pm-st').value, notes: [], experience: null, expDraft: null };
        np.analysis = RC.ai.analyzeSync(np);
        RC.state.projects.push(np); ui().selectedProject = np.id; ui().projectTab = 'files';
        RC.toast('새 프로젝트를 만들었어요');
      } else {
        p.name = name; p.shortName = name.replace(/\s*(프로젝트)$/, ''); p.topic = m.$('#pm-topic').value.trim(); p.dates = dates; p.status = m.$('#pm-st').value;
        p.analysis = RC.ai.analyzeSync(p); RC.toast('프로젝트를 수정했어요');
      }
      RC.store.emit(); m.close(); V.render();
    };
    if (!isNew) m.$('[data-del]').onclick = function () {
      RC.confirm('"' + p.name + '"와 모든 자료를 삭제할까요? 되돌릴 수 없어요.', '삭제', true).then(function (ok) {
        if (!ok) return;
        var id = p.id;
        RC.state.projects = RC.state.projects.filter(function (x) { return x.id !== id; });
        RC.state.experiences = RC.state.experiences.filter(function (x) { return x.projectId !== id; });
        var ids = {}; RC.state.experiences.forEach(function (e) { ids[e.id] = 1; });
        RC.state.relations = RC.state.relations.filter(function (r) { return ids[r.a] && ids[r.b]; });
        RC.state.portfolio.selected = RC.state.portfolio.selected.filter(function (x) { return x !== id; });
        RC.state.portfolio.order = RC.state.portfolio.order.filter(function (x) { return x !== id; });
        // 연결 그래프 노트에서 삭제된 프로젝트와의 연결선 정리 (노트 자체는 남김)
        (RC.state.graphNotes || []).forEach(function (n) { n.projectIds = (n.projectIds || []).filter(function (x) { return x !== id; }); });
        ui().selectedProject = RC.state.projects.length ? RC.state.projects[0].id : null;
        ui().selectedExp = RC.state.experiences.length ? RC.state.experiences[0].id : null;
        RC.store.emit(); m.close(); RC.toast('프로젝트를 삭제했어요'); V.render();
      });
    };
  }

  function addNoteModal() {
    var p = cur(), type = 'link';
    var m = RC.modal({
      title: '링크 · 메모 추가',
      html: '<div class="field"><div class="seg" id="seg"><button data-t="link" class="on">링크</button><button data-t="memo">메모</button></div></div>' +
        '<div class="field"><label>이름</label><input id="an-name" placeholder="예: 팀 회의록"></div>' +
        '<div class="field" id="an-urlf"><label>링크 주소</label><input id="an-url" placeholder="https://"></div>' +
        '<div class="field"><label id="an-tl">설명 (선택)</label><textarea id="an-text" placeholder="분석에 활용할 내용을 적어주세요."></textarea></div>' +
        '<div class="modal-actions"><button class="btn" data-cancel>취소</button><button class="btn primary" data-ok>추가</button></div>'
    });
    m.$('#seg').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return; type = b.dataset.t;
      Array.prototype.forEach.call(m.$('#seg').children, function (x) { x.classList.toggle('on', x === b); });
      m.$('#an-urlf').classList.toggle('hidden', type === 'memo'); m.$('#an-tl').textContent = type === 'memo' ? '메모 내용' : '설명 (선택)';
    };
    m.$('[data-cancel]').onclick = m.close;
    m.$('[data-ok]').onclick = function () {
      var name = m.$('#an-name').value.trim(), text = m.$('#an-text').value.trim(), url = m.$('#an-url').value.trim();
      if (!name) { RC.toast('이름을 입력해 주세요'); return; }
      if (type === 'memo' && !text) { RC.toast('메모 내용을 입력해 주세요'); return; }
      p.notes.push({ id: RC.u.uid('n'), type: type, name: name, size: 0, createdAt: new Date().toISOString(), tag: '', text: text, url: url });
      RC.store.emit(); m.close(); RC.toast('자료가 추가되었어요 · 기록 확인을 다시 했어요'); refresh(p);
    };
  }

  function noteMenu(btn) {
    var p = cur(), n = p.notes.filter(function (x) { return x.id === btn.dataset.id; })[0];
    if (!n) return;
    RC.popMenu(btn, [
      { label: '내용 보기', icon: 'eye', fn: function () { RC.viewNote(n); } },
      { label: '이름 변경', icon: 'pen', fn: function () {
        var m = RC.modal({ title: '이름 변경', html: '<div class="field"><input id="rn" value="' + esc(n.name) + '"></div><div class="modal-actions"><button class="btn" data-cancel>취소</button><button class="btn primary" data-ok>저장</button></div>' });
        m.$('[data-cancel]').onclick = m.close;
        var ok = function () { var v = m.$('#rn').value.trim(); if (!v) return; n.name = v; RC.store.emit(); m.close(); V.render(); };
        m.$('[data-ok]').onclick = ok; m.$('#rn').onkeydown = function (e) { if (e.key === 'Enter') ok(); };
      } },
      { label: n.tag === 'result' ? '결과물 표시 해제' : '결과물로 표시', icon: 'target', fn: function () { n.tag = n.tag === 'result' ? '' : 'result'; RC.store.emit(); refresh(p); } },
      { label: '삭제', icon: 'trash', danger: true, fn: function () {
        RC.confirm('"' + n.name + '"을(를) 삭제할까요?', '삭제', true).then(function (ok) {
          if (!ok) return; p.notes = p.notes.filter(function (x) { return x !== n; });
          RC.state.experiences.forEach(function (e) { e.records = e.records.filter(function (r) { return r.noteId !== n.id; }); });
          RC.store.emit(); RC.toast('자료를 삭제했어요 · 기록 확인을 다시 했어요'); refresh(p);
        });
      } }
    ]);
  }

  /* ---------- experience confirm -> graph ---------- */
  function saveExperience(p) {
    var d = p.expDraft; if (!d) return;
    var old = p.experience || {}, changed = ['role', 'problem', 'process', 'result', 'reflection'].some(function (k) { return (old[k] || '') !== (d[k] || ''); });
    var exp = { role: d.role || '', activity: d.activity || '', problem: d.problem || '', process: d.process || '', result: d.result || '', reflection: d.reflection || '', interests: d.interests || [], confirmed: true };
    if (old.draft && !changed) exp.draft = old.draft;
    p.experience = exp; p.expDraft = null;
    var main = RC.store.mainExp(p.id);
    var tags = []; (exp.interests || []).concat(exp.activity.split(/[\/·,]/)).forEach(function (t) { t = t.trim(); if (t && tags.indexOf(t) < 0) tags.push(t); });
    var recs = p.notes.filter(function (n) { return n.text; }).slice(0, 3).map(function (n) { return { name: n.name, noteId: n.id }; });
    if (!main) {
      main = { id: RC.u.uid('e'), projectId: p.id, main: true, name: p.shortName + ' 경험', cardTitle: p.shortName };
      RC.state.experiences.push(main);
    }
    main.role = exp.role || main.role || ''; main.tags = tags; main.records = recs.length ? recs : (main.records || []);
    main.desc = exp.process || exp.problem || main.desc || ''; main.summary = [exp.process, exp.result].filter(Boolean).join(' ') || main.desc;
    // drop unconfirmed suggestions of this experience, then re-run relation finding
    RC.state.relations = RC.state.relations.filter(function (r) { return r.confirmed || (r.a !== main.id && r.b !== main.id); });
    return RC.ai.findRelations(main.id, RC.state.experiences, RC.state.relations).then(function (found) {
      found.forEach(function (r) { r.id = RC.u.uid('r'); r.confirmed = r.confidence === 'high'; RC.state.relations.push(r); });
      ui().selectedExp = main.id;
      RC.store.emit();
      RC.toast('경험을 저장했어요 · 연결 ' + found.length + '개를 찾았어요' + (found.some(function (r) { return r.confidence === 'mid'; }) ? ' (확인이 필요한 연결 포함)' : ''));
      V.render();
    });
  }

  V.acts['select-project'] = function (el) { ui().selectedProject = el.dataset.id; answerOpen = null; V.render(); };
  V.acts['tab'] = function (el) { ui().projectTab = el.dataset.tab; RC.store.save(); V.render(); };
  V.acts['new-project'] = function () { projectModal(null); };
  V.acts['edit-project'] = function () { projectModal(cur()); };
  V.acts['add-note'] = addNoteModal;
  // 시연용 샘플 자료 (실제 파일 분석 없음)
  V.acts['add-sample'] = function () {
    var p = cur(), now = Date.now();
    p.notes.push({ id: RC.u.uid('n'), type: 'memo', name: '활동 메모 (샘플)', size: 0, createdAt: new Date(now).toISOString(), tag: '',
      text: '현장을 관찰하고 사람들을 인터뷰했다. 내가 질문지를 맡았다. 불편이 왜 생기는지 정리했고, 다음엔 개선안을 직접 시도해 보고 싶다.' });
    p.notes.push({ id: RC.u.uid('n'), type: 'link', name: '참고 자료 링크 (샘플)', size: 0, createdAt: new Date(now + 1000).toISOString(), tag: '', url: 'https://example.com/sample', text: '' });
    RC.store.emit(); RC.toast('샘플 자료 2개를 넣었어요'); refresh(p);
  };
  V.acts['open-gnote'] = function (el) { RC.views.learning.openNote(el.dataset.id); RC.go('#/learning'); };
  V.acts['gnote-graph'] = function () { RC.views.learning.openProject(cur().id); RC.go('#/learning'); };
  V.acts['pick-file'] = function () { ensureInput(); forceResult = false; fileInput.click(); };
  V.acts['note-menu'] = function (el, e) { e.stopPropagation(); noteMenu(el); };
  V.acts['note-open'] = function () {};
  V.acts['guide-upload'] = function (el) { ensureInput(); forceResult = el.dataset.key === 'result'; fileInput.click(); };
  V.acts['guide-edit'] = function () { projectModal(cur()); };
  V.acts['guide-answer'] = function (el) { answerOpen = el.dataset.key; V.render(); var t = root.querySelector('textarea[data-in="answer"]'); if (t) t.focus(); };
  V.acts['answer-cancel'] = function () { answerOpen = null; V.render(); };
  V.acts['answer-save'] = function (el) {
    var t = root.querySelector('textarea[data-in="answer"]'), v = t ? t.value.trim() : '';
    if (!v) { RC.toast('내용을 적어 주세요'); return; }
    var p = cur(), key = el.dataset.key, g = RC.ai.suggestSync(p, p.analysis).filter(function (x) { return x.key === key; })[0];
    p.notes.push({ id: RC.u.uid('n'), type: 'memo', name: '답변 · ' + (g ? g.question.replace('?', '') : RC.ai.LABEL[key]), size: 0, createdAt: new Date().toISOString(), tag: '', text: v, answerKey: key });
    answerOpen = null; RC.store.emit(); RC.toast('자료가 추가되었어요 · 기록 확인을 다시 했어요'); refresh(p);
  };
  V.acts['ai-extract'] = function () {
    var p = cur(); aiLoading = true; V.render();
    RC.ai.extractExperience(p).then(function (r) {
      aiLoading = false; r.fromAI = true; p.expDraft = r; RC.store.emit();
      if (RC.cur === V) { V.render(); RC.toast('AI가 경험을 정리했어요 · 확인하고 저장해 주세요'); }
    });
  };
  V.acts['exp-save'] = function () { saveExperience(cur()); };
  V.acts['exp-discard'] = function () { cur().expDraft = null; RC.store.emit(); V.render(); };
  V.ins['exp'] = function (el) {
    var p = cur();
    if (!p.expDraft) { var o = p.experience || {}; p.expDraft = { role: o.role || '', activity: o.activity || '', problem: o.problem || '', process: o.process || '', result: o.result || '', reflection: o.reflection || '', interests: (o.interests || []).slice(), fromAI: false }; var b = root.querySelector('[data-act="exp-save"]'); if (b) b.disabled = false; }
    var k = el.dataset.k;
    p.expDraft[k] = k === 'interests' ? el.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean) : el.value;
    RC.store.save();
  };

  V.focusNote = function (pid, noteId) { ui().selectedProject = pid; ui().projectTab = 'files'; ui().flashNote = noteId; };
  V.mount = function (el) { root = el; V.render(el); };
  RC.views = RC.views || {}; RC.views.projects = V;
})(window.RC);

</script>
<script>
/* 연결 그래프 · 나의 배움 정리 (#/learning)
