    if (!node) {
      p.innerHTML = '<div class="panel-label">연결 그래프</div><h2>어느 쪽이 궁금한가요?</h2><p class="desc">대학 진학이나 취업을 고르면 내 프로젝트와 이어진 길이 펼쳐져요.</p>' +
        '<h3 class="section-title">내 프로젝트</h3><div class="next-list">' + RC.state.projects.map(function (q) { return projRow(q.id); }).join('') + '</div>' + SAMPLE_HINT;
      return;
    }
    var children = getChildren().filter(function (n) { return n.kind !== 'project'; });
    var pids = evidencePids(node);
    var html = '<div class="panel-label">' + esc(kindLabel(node)) + '</div><h2>' + esc(node.label) + '</h2>' +
      '<p class="desc">' + esc(node.desc || (node.kind === 'info' ? node.sub + ' · 이 단계에서 챙길 준비 항목이에요.' : node.sub) || '') + '</p>';
    if (node.score) html += '<div class="score-card"><div class="score-top"><b>연결도 <em>샘플</em></b><span>' + node.score + '%</span></div><div class="bar"><i style="width:' + node.score + '%"></i></div></div>';
    if (children.length) {
      html += '<h3 class="section-title">다음 선택</h3><div class="next-list">' + children.map(function (n) {
        return '<button class="next-btn' + (n.id === s.sel ? ' on' : '') + '" data-act="lm-pick" data-id="' + esc(n.id) + '">' + dot(n.kind) + esc(n.label) + (n.sub ? '<small>' + esc(n.sub) + '</small>' : '') + '</button>';
      }).join('') + '</div>';
    }
    if (pids.length) html += '<h3 class="section-title">' + (node.kind === 'root' ? '내 프로젝트' : '연결된 프로젝트') + '</h3><div class="next-list">' + pids.map(projRow).join('') + '</div>';
    if (node.tags && node.tags.length) html += '<h3 class="section-title">강점 키워드</h3><div class="tags">' + node.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
    p.innerHTML = html + SAMPLE_HINT;
  }
  function updatePanelProject(pr) {
    var p = root.querySelector('#lmPanel'); if (!p) return;
    var e = RC.store.mainExp(pr.id);
    p.innerHTML = '<div class="panel-label">프로젝트</div><h2>' + esc(pr.name) + '</h2>' +
      '<p class="desc">' + esc([pr.topic, RC.u.period(pr), pr.status].filter(Boolean).join(' · ')) + '</p>' +
      '<div class="tags" style="margin-top:12px"><span class="tag">자료 ' + pr.notes.length + '개</span><span class="tag">연결 노트 ' + notesOf(pr.id).length + '개</span></div>' +
      (e && e.summary ? '<h3 class="section-title">한 줄 요약</h3><p class="desc">' + esc(e.summary) + '</p>' : '') +
      '<div class="panel-btns"><button class="btn sm primary" data-act="lm-add">' + icon('plus') + '노트 추가</button><button class="btn sm" data-act="lm-goproj" data-pid="' + esc(pr.id) + '">프로젝트 관리</button></div>' +
      '<p class="panel-hint">연결된 노트는 그래프 아래에 모여 있어요.</p>';
  }
  function updatePanelNote(n) {
    var p = root.querySelector('#lmPanel'); if (!p) return;
    p.innerHTML = '<div class="panel-label">내 노트</div><h2 id="lmNoteTitle">' + esc(n.title || '제목 없음') + '</h2><p class="desc">그래프 아래에서 바로 고칠 수 있어요.</p>' +
      '<h3 class="section-title">연결된 프로젝트</h3><div class="next-list">' + ((n.projectIds || []).map(projRow).join('') || '<div class="hint">연결된 프로젝트가 없어요.</div>') + '</div>' +
      '<p class="panel-hint">노트 노드를 끌어서 위치를 옮길 수 있어요.</p>';
  }

  /* ---------- 그래프 아래 노트 패널 ---------- */
  function badge(st) { return st === 'saving' ? icon('refresh') + ' 저장 중…' : st === 'error' ? icon('info') + ' 저장 실패' : icon('check') + ' 저장됨'; }
  function dock() { return root && root.querySelector('#lmDock'); }
  function noteDockHtml(n) {
    var chips = RC.state.projects.map(function (p) {
      var on = n.projectIds.indexOf(p.id) >= 0;
      return '<button class="pchip' + (on ? ' on' : '') + '" data-act="nd-link" data-pid="' + esc(p.id) + '" aria-pressed="' + on + '">' + (on ? '✓ ' : '+ ') + esc(pname(p)) + '</button>';
    }).join('');
    return '<div class="nd-head"><span class="nd-kind"><i></i>내 노트</span><span class="save-state" id="ndSave">' + badge('saved') + '</span>' +
      '<div class="nd-actions"><button class="btn sm primary" data-act="nd-save">' + icon('check') + '저장</button><button class="btn sm danger" data-act="nd-del">' + icon('trash') + '삭제</button>' +
      '<button class="icon-btn" data-act="nd-close" aria-label="노트 닫기">' + icon('x') + '</button></div></div>' +
      '<input class="nd-title" data-in="nd-title" value="' + esc(n.title) + '" placeholder="노트 제목" maxlength="60" aria-label="노트 제목">' +
      '<div class="nd-links"><span class="lbl">연결 프로젝트</span>' + chips + '</div>' +
      '<textarea class="nd-body" data-in="nd-body" placeholder="배운 점, 다음에 해볼 것… 짧게 적어도 괜찮아요." aria-label="노트 본문">' + esc(n.body) + '</textarea>' +
      '<div class="nd-meta"><span>만든 날 ' + RC.u.noteDate(n.createdAt) + '</span><span id="ndUpd">수정 ' + RC.u.noteDate(n.updatedAt) + '</span></div>';
  }
  function projectDockHtml(p) {
    var list = notesOf(p.id).slice().sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });
    return '<div class="nd-head"><span class="nd-kind proj"><i></i>프로젝트</span><h3>' + esc(p.name) + '</h3>' +
      '<div class="nd-actions"><button class="btn sm" data-act="lm-goproj" data-pid="' + esc(p.id) + '">프로젝트 관리</button><button class="btn sm primary" data-act="lm-add">' + icon('plus') + '노트 추가</button>' +
      '<button class="icon-btn" data-act="nd-close" aria-label="닫기">' + icon('x') + '</button></div></div>' +
      (list.length ? '<div class="nd-cards">' + list.map(function (n) {
        return '<button class="nd-card" data-act="nd-open" data-id="' + esc(n.id) + '"><b><i></i>' + esc(n.title || '제목 없음') + '</b><span class="p">' + (esc(n.body) || '<span class="hint">아직 내용이 없어요</span>') + '</span><small>' + RC.u.noteDate(n.updatedAt) + '</small></button>';
      }).join('') + '</div>' : '<div class="nd-empty">아직 연결된 노트가 없어요. <b>+ 노트 추가</b>로 첫 노트를 남겨보세요.</div>');
  }
  function scrollDock() { var d = dock(); if (d) setTimeout(function () { d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 40); }
  function openNote(id, scroll) {
    var n = noteById(id); if (!n) return;
    flushSave();
    setSel(id); RC.state.ui.noteOpen = id; save();
    var d = dock(); if (d) { d.classList.remove('hidden'); d.innerHTML = noteDockHtml(n); }
    updatePanelNote(n); redraw();
    if (scroll) scrollDock();
  }
  function openProject(pid, scroll) {
    var p = RC.store.project(pid); if (!p) return;
    flushSave();
    setSel(PN(pid)); if (RC.state.ui.noteOpen) { RC.state.ui.noteOpen = null; save(); }
    var d = dock(); if (d) { d.classList.remove('hidden'); d.innerHTML = projectDockHtml(p); }
    updatePanelProject(p); redraw();
    if (scroll) scrollDock();
  }
  function closeDock() {
    flushSave();
    if (RC.state.ui.noteOpen) { RC.state.ui.noteOpen = null; save(); }
    var d = dock(); if (d) { d.classList.add('hidden'); d.innerHTML = ''; }
  }
  function curNote() { return gselType === 'note' ? noteById(gsel) : null; }
  // 입력 중에는 '저장 중…', 잠시 멈추면 localStorage에 저장하고 '저장됨'
  function touch(n) {
    editingId = n.id;
    var b = root.querySelector('#ndSave'); if (b) b.innerHTML = badge('saving');
    clearTimeout(saveTimer); saveTimer = setTimeout(commit, 600);
  }
  function commit() {
    clearTimeout(saveTimer); saveTimer = null;
    var n = editingId ? noteById(editingId) : null; editingId = null;
    if (n) n.updatedAt = new Date().toISOString();
    var ok = RC.store.save();
    var b = root && root.querySelector('#ndSave'); if (b) b.innerHTML = badge(ok ? 'saved' : 'error');
    var u = root && root.querySelector('#ndUpd'); if (u && n) u.textContent = '수정 ' + RC.u.noteDate(n.updatedAt);
    return ok;
  }
  function flushSave() { if (saveTimer) commit(); }

  function defaultPids() {
    if (gselType === 'project') return [gsel.slice(5)];
    if (gselType === 'note') { var n = noteById(gsel); return n ? n.projectIds.slice() : []; }
    return [];
  }
  function addNoteModal(pre) {
    var ps = RC.state.projects;
    if (!ps.length) { RC.toast('먼저 프로젝트를 만들어 주세요'); return; }
    var sel = pre.filter(function (pid) { return RC.store.project(pid); });
    var m = RC.modal({
      title: '새 노트',
      html: '<div class="field"><label>제목</label><input id="gn-title" maxlength="60" placeholder="예: 인터뷰 질문 만드는 법"></div>' +
        '<div class="field"><label>연결할 프로젝트 <span class="hint">· 여러 개 고를 수 있어요</span></label><div class="nd-links" id="gn-ps" style="margin:2px 0 0">' +
        ps.map(function (p) { var on = sel.indexOf(p.id) >= 0; return '<button type="button" class="pchip' + (on ? ' on' : '') + '" data-pid="' + esc(p.id) + '">' + (on ? '✓ ' : '+ ') + esc(pname(p)) + '</button>'; }).join('') +
        '</div></div><div class="modal-actions"><button class="btn" data-cancel>취소</button><button class="btn primary" data-ok>노트 만들기</button></div>'
    });
    m.$('#gn-ps').onclick = function (e) {
      var b = e.target.closest('[data-pid]'); if (!b) return;
      var pid = b.dataset.pid, i = sel.indexOf(pid);
      if (i >= 0) sel.splice(i, 1); else sel.push(pid);
      b.classList.toggle('on', i < 0); b.textContent = (i < 0 ? '✓ ' : '+ ') + pname(RC.store.project(pid));
    };
    m.$('[data-cancel]').onclick = m.close;
    var ok = function () {
      if (!sel.length) { RC.toast('연결할 프로젝트를 하나 이상 골라 주세요'); return; }
      var now = new Date().toISOString();
      var n = { id: RC.u.uid('gn'), title: m.$('#gn-title').value.trim() || '새 노트', body: '', projectIds: sel.slice(), createdAt: now, updatedAt: now };
      notes().push(n); save(); m.close();
      born[n.id] = Date.now(); refreshGraph(); animate(900);
      openNote(n.id, true);
      setTimeout(function () { fitView(600); }, 60);
      var t = root.querySelector('.nd-body'); if (t) t.focus({ preventScroll: true });
      RC.toast('노트를 추가했어요 · 아래에 내용을 적어보세요');
    };
    m.$('[data-ok]').onclick = ok;
    m.$('#gn-title').onkeydown = function (e) { if (e.key === 'Enter' && !e.isComposing) ok(); };
  }

  /* ---------- 화면 ---------- */
  function pageHtml(s) {
    return '<div class="page-head"><div><h1 class="title">연결 그래프</h1><p class="subtitle">노드를 눌러 탐색하고, 내 프로젝트에 노트를 연결해요.</p></div><span class="sample-badge">추천·학교·조직은 샘플 데이터</span></div>' +
      '<div class="workspace"><section class="graph-shell" aria-label="연결 그래프">' +
      '<div class="graph-toolbar"><div id="lmCrumbs" class="crumbs"></div><div class="toolbar-actions"><button class="tool-btn add" data-act="lm-add">+ 노트 추가</button><button class="tool-btn" data-act="lm-back" hidden>← 이전</button><button class="tool-btn" data-act="lm-reset">처음부터</button></div></div>' +
      '<div class="stage"><div id="lmGraph" aria-hidden="true"></div></div>' +
      '<div id="lmDecision" class="decision' + (s.mode ? ' hidden' : '') + '"><div class="decision-inner">' +
      '<h2>어느 쪽이 더 궁금한가요?</h2><p class="lead">언제든 바꿀 수 있어요.</p><div class="choice-grid">' +
      '<button class="choice" data-act="lm-mode" data-mode="college"><span class="choice-icon">🎓</span><h3>대학 진학</h3><p>내 프로젝트와 맞는 전공 찾기</p></button>' +
      '<button class="choice" data-act="lm-mode" data-mode="career"><span class="choice-icon">💼</span><h3>취업</h3><p>내 강점과 맞는 직무 찾기</p></button>' +
      '</div></div></div>' +
      '<div class="legend"><span>' + dot('recommend') + '추천</span><span>' + dot('target') + '학교·조직</span><span>' + dot('info') + '준비 정보</span><span>' + dot('project') + '프로젝트</span><span>' + dot('note') + '내 노트</span></div>' +
      '<div class="zoom"><button data-act="lm-zin" aria-label="확대">+</button><button data-act="lm-zout" aria-label="축소">−</button><button data-act="lm-fit" aria-label="전체 보기" title="전체 보기">⤢</button></div>' +
      '</section><aside class="lm-panel" id="lmPanel" aria-live="polite"></aside></div>' +
      '<section id="lmDock" class="note-dock hidden" aria-label="노트"></section>';
  }

  V.acts['lm-mode'] = function (el) { chooseMode(el.dataset.mode); };
  V.acts['lm-back'] = function () { back(); };
  V.acts['lm-reset'] = function () { reset(); };
  V.acts['lm-zin'] = function () { if (graph) graph.zoom(graph.zoom() * 1.3, 250); };
  V.acts['lm-zout'] = function () { if (graph) graph.zoom(graph.zoom() / 1.3, 250); };
  V.acts['lm-fit'] = function () { fitView(500); };
  V.acts['lm-pick'] = function (el) { var n = findNode(el.dataset.id); if (n) selectNode(n); };
  V.acts['lm-proj'] = function (el) { openProject(el.dataset.pid, true); };
  V.acts['lm-add'] = function () { addNoteModal(defaultPids()); };
  V.acts['lm-goproj'] = function (el) { RC.state.ui.selectedProject = el.dataset.pid; RC.state.ui.projectTab = 'gnotes'; save(); RC.go('#/projects'); };
  V.acts['nd-open'] = function (el) { openNote(el.dataset.id, true); };
  V.acts['nd-close'] = function () { setSel(null); closeDock(); updatePanel(currentNode()); redraw(); };
  V.acts['nd-save'] = function () { var n = curNote(); if (!n) return; editingId = n.id; if (commit()) RC.toast('노트를 저장했어요'); };
  V.acts['nd-link'] = function (el) {
    var n = curNote(); if (!n) return;
    var pid = el.dataset.pid, i = n.projectIds.indexOf(pid);
    if (i >= 0 && n.projectIds.length === 1) { RC.toast('노트는 프로젝트 1개 이상과 연결돼야 해요'); return; }
    if (i >= 0) n.projectIds.splice(i, 1); else n.projectIds.push(pid);
    n.updatedAt = new Date().toISOString(); save();
    refreshGraph(); openNote(n.id, false);
    RC.toast(i >= 0 ? '연결을 해제했어요' : '프로젝트와 연결했어요');
  };
  V.acts['nd-del'] = function () {
    var n = curNote(); if (!n) return;
    RC.confirm('"' + (n.title || '제목 없음') + '" 노트를 삭제할까요?', '삭제', true).then(function (ok) {
      if (!ok) return;
      clearTimeout(saveTimer); saveTimer = null; editingId = null;
      RC.state.graphNotes = notes().filter(function (x) { return x.id !== n.id; });
      setSel(null); closeDock(); save();
      refreshGraph(); updatePanel(currentNode());
      RC.toast('노트를 삭제했어요');
    });
  };
  V.ins['nd-title'] = function (el) {
    var n = curNote(); if (!n) return;
    n.title = el.value;
    var gn = graphNode(n.id); if (gn) gn.label = n.title.trim() || '제목 없음';
    var h = root.querySelector('#lmNoteTitle'); if (h) h.textContent = n.title.trim() || '제목 없음';
    redraw(); touch(n);
  };
  V.ins['nd-body'] = function (el) { var n = curNote(); if (!n) return; n.body = el.value; touch(n); };

  // 다른 화면에서 특정 노트/프로젝트를 열고 들어올 때 사용
  V.openNote = function (id) { pending = { note: id }; };
  V.openProject = function (pid) { pending = { project: pid }; };
  // 테스트·디버깅용: 현재 그래프 노드의 화면 좌표 (읽기 전용)
  V.inspect = function () {
    var box = root && root.querySelector('#lmGraph');
    if (!graph || !box) return [];
    var b = box.getBoundingClientRect();
    return graph.graphData().nodes.filter(function (n) { return n.kind !== 'bg'; }).map(function (n) {
      var c = graph.graph2ScreenCoords(n.x, n.y); return { id: n.id, kind: n.kind, label: n.label, x: b.left + c.x, y: b.top + c.y };
    });
  };

  V.destroy = function () {
    flushSave();
    clearTimeout(centerTimer); clearTimeout(animTimer);
    if (ro) { ro.disconnect(); ro = null; }
    if (graph) { try { if (graph._destructor) graph._destructor(); } catch (e) {} graph = null; }
  };
  V.mount = function (el) {
    V.destroy(); root = el;
    var s = state();
    if (s.mode && !data[s.mode]) { s.mode = null; s.path = []; s.sel = null; }
    el.innerHTML = '<div class="page lm">' + pageHtml(s) + '</div>';
    setSel(null); hoverId = null;
    initGraph();
    render();
    var p = pending; pending = null;
    var openId = (p && p.note) || RC.state.ui.noteOpen;
    if (openId && noteById(openId)) { openNote(openId, !!(p && p.note)); return; }
    if (p && p.project && RC.store.project(p.project)) { openProject(p.project, true); return; }
    if (RC.state.ui.noteOpen) { RC.state.ui.noteOpen = null; save(); }
    var sel = s.sel ? findNode(s.sel) : null;
    if (sel) setSel(sel.id);
    updatePanel(s.mode ? (sel || currentNode()) : null);
  };
  RC.views = RC.views || {}; RC.views.learning = V;
})(window.RC);

</script>
<script>
/* 포트폴리오 만들기: 3단계 위저드 (#/portfolio/1~3) */
window.RC = window.RC || {};
(function (RC) {
  var esc = RC.u.esc, icon = RC.icon;
  var V = { acts: {}, ins: {} };
  var root = null, step = 1, building = false, refining = null, focusSec = 'problem', diff = null, saveTimer = null;
  var SECS = [
    ['problem', '문제', '프로젝트를 시작하게 된 배경과 해결하고자 했던 문제를 작성해보세요.'],
    ['role', '내 역할과 과정', '프로젝트에서 내가 맡은 역할과 진행 과정을 구체적으로 작성해보세요.'],
    ['result', '결과와 회고', '프로젝트의 결과와 배운 점, 앞으로의 적용점을 작성해보세요.']
  ];
  var MAX = 500;
  function pf() { return RC.state.portfolio; }
  function proj(id) { return RC.store.project(id); }
  function curPid() { var f = pf(); if (f.order.indexOf(f.cur) < 0) f.cur = f.order[0]; return f.cur; }

  function stepper(n) {
    var L = ['유형 선택', '경험 선택', '초안 편집'];
    return '<div class="stepper">' + L.map(function (t, i) {
      var k = i + 1, cls = k < n ? 'done' : k === n ? 'cur' : '';
      return (i ? '<span class="step-line"></span>' : '') + '<a class="step ' + cls + '" href="#/portfolio/' + k + '"><span class="n">' + (k < n ? icon('check') : k) + '</span>' + t + '</a>';
    }).join('') + '</div>';
  }
  function top(n) { return '<div class="pf-top"><div class="crumb"><b>RE:Cord</b> &nbsp;›&nbsp; 포트폴리오 만들기</div>' + stepper(n) + '<span style="width:120px" class="hide-sm"></span></div>'; }

  /* ---------- step 1 ---------- */
  function step1() {
    var t = pf().type;
    function li(b, s) { return '<li><span class="ck">' + icon('check') + '</span><span><b>' + b + '</b><small>' + s + '</small></span></li>'; }

        f.order.map(function (id, i) {
          var p = proj(id), d = f.drafts[id] || {};
          return '<div class="pj"><h4>' + RC.u.pad(i + 1) + ' &nbsp;' + esc(p.name) + '</h4><div style="color:#666">' + RC.u.period(p) + '</div><dl>' +
            SECS.map(function (s) { return '<dt>' + s[1].replace('내 역할과 과정', '역할·과정').replace('결과와 회고', '결과·회고') + '</dt><dd>' + (esc(d[s[0]]) || '<span style="color:#999">(기록 없음)</span>') + '</dd>'; }).join('') + '</dl></div>';
        }).join('') + '</div>';
    }
    var m = RC.modal({ title: '미리보기', wide: true, html: html + '<div class="modal-actions no-print"><button class="btn" data-close>닫기</button><button class="btn primary" data-print>' + icon('printer') + ' 인쇄 / PDF 저장</button></div>', noFocus: true });
    m.$('[data-close]').onclick = m.close;
    m.$('[data-print]').onclick = function () {
      document.body.classList.add('printing');
      var done = function () { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done); window.print();
    };
  };

  function render() {
    var f = pf(), html;
    if (!f.type) f.type = 'project';
    if (step === 3 && (!f.built || !f.order.length)) { RC.go('#/portfolio/2'); return; }
    if (step === 1) html = step1();
    else if (step === 2) html = step2();
    else html = f.type === 'alt' ? step3Alt() : step3Project();
    root.innerHTML = '<div class="page">' + html + '</div>';
  }

  V.mount = function (el, r) { root = el; step = r.step; diff = diff && step === 3 ? diff : null; render(); };
  RC.views = RC.views || {}; RC.views.portfolio = V;
})(window.RC);

</script>
<script>
/* App shell: sidebar, topbar, search, hash router */
(function (RC) {
  var esc = RC.u.esc, icon = RC.icon;
  var $ = function (id) { return document.getElementById(id); };
  var viewEl;

  function route() {
    var h = (location.hash || '#/projects').replace(/^#\/?/, '').split('/');
    var top = h[0] || 'projects';
    if (top === 'learning') return { name: 'learning', nav: 'learning' };
    if (top === 'portfolio') return { name: 'portfolio', step: Math.min(3, Math.max(1, parseInt(h[1], 10) || 1)), nav: 'portfolio' };
    if (top === 'coach') return { name: 'coach', nav: 'coach' };
    return { name: 'projects', nav: 'projects' };
  }

  function renderSidebar(r) {
    var items = [['projects', '#/projects', 'home', '프로젝트 관리'], ['learning', '#/learning', 'graph', '연결 그래프'], ['portfolio', '#/portfolio/1', 'file', '포트폴리오 만들기']];
    $('sidebar').innerHTML = '<a class="logo" href="#/projects"><span class="logo-row">' + RC.logo + 'RE:Cord</span></a>' +
      '<nav class="nav">' + items.map(function (i) {
        return '<a href="' + i[1] + '" class="' + (r.nav === i[0] ? 'active' : '') + '">' + icon(i[2]) + i[3] + '</a>';
      }).join('') + '</nav>' +
      '<div class="side-foot">중간 체크인 프로토타입<br>샘플 데이터 · 브라우저에만 저장돼요.</div>';
  }

  function renderTopbar() {
    $('topbar').innerHTML = '<div class="search">' + icon('search') + '<input id="q" placeholder="프로젝트 · 노트 검색" autocomplete="off" aria-label="검색"><div class="search-pop hidden" id="qpop"></div></div>' +
      '<button class="icon-btn" aria-label="알림" id="bell">' + icon('bell') + '<span class="badge"></span></button>' +
      '<div class="user"><button class="user-btn" id="userbtn" data-menu><span class="avatar">' + esc(RC.state.user.name.charAt(0)) + '</span><span class="nm">' + esc(RC.state.user.name) + '님</span>' + icon('chevD') + '</button></div>';
  }

  function render() {
    var r = route();
    renderSidebar(r);
    RC.closeMenus();
    var V = RC.views[r.name];
    RC.cur = V; RC.route = r;
    if (V.destroy) V.destroy();
    window.scrollTo(0, 0);
    V.mount(viewEl, r);
  }

  /* ---------- search ---------- */
  function hi(text, q) {
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }
  function search(q) {
    q = q.trim(); var out = [];
    if (!q) return out;
    var m = function (s) { return (s || '').toLowerCase().indexOf(q.toLowerCase()) >= 0; };
    RC.state.projects.forEach(function (p) {
      if (m(p.name) || m(p.topic)) out.push({ g: '프로젝트', label: p.name, ico: 'home', go: { t: 'project', pid: p.id } });
      p.notes.forEach(function (n) { if (m(n.name) || m(n.text)) out.push({ g: '노트', label: n.name + ' · ' + p.shortName, ico: RC.noteIcon(n), go: { t: 'note', pid: p.id, nid: n.id } }); });
    });
    RC.state.experiences.forEach(function (e) {
      if (m(e.name) || (e.tags || []).some(m) || m(e.desc)) out.push({ g: '경험·키워드', label: e.name, ico: 'graph', go: { t: 'exp', eid: e.id } });
    });
    RC.state.interests.forEach(function (i) { if (m(i)) out.push({ g: '경험·키워드', label: '관심사 · ' + i, ico: 'sparkle', go: { t: 'interest', name: i } }); });
    (RC.state.graphNotes || []).forEach(function (n) { if (m(n.title) || m(n.body)) out.push({ g: '내 노트', label: n.title || '제목 없음', ico: 'pen', go: { t: 'gnote', id: n.id } }); });
    return out.slice(0, 12);
  }
  function bindSearch() {
    var q = $('q'), pop = $('qpop'), results = [];
    q.addEventListener('input', function () {
      results = search(q.value);
      if (!q.value.trim()) { pop.classList.add('hidden'); return; }
      var last = '';
      pop.innerHTML = results.length ? results.map(function (r, i) {
        var h = r.g !== last ? '<h6>' + r.g + '</h6>' : ''; last = r.g;
        return h + '<button data-i="' + i + '">' + icon(r.ico) + '<span>' + hi(r.label, q.value.trim()) + '</span></button>';
      }).join('') : '<div class="empty">검색 결과가 없어요</div>';
      pop.classList.remove('hidden');
    });
    pop.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var g = results[+b.dataset.i].go; pop.classList.add('hidden'); q.value = '';
      var s = RC.state.ui;
      if (g.t === 'project') { s.selectedProject = g.pid; s.projectTab = 'files'; RC.go('#/projects'); }
      else if (g.t === 'note') { RC.views.projects.focusNote(g.pid, g.nid); RC.go('#/projects'); }
      else if (g.t === 'gnote') { RC.views.learning.openNote(g.id); RC.go('#/learning'); }
      else if (g.t === 'exp') { s.selectedExp = g.eid; RC.go('#/learning'); }
      else { s.selectedInterest = g.name; RC.go('#/learning'); }
      RC.store.save();
    });
    document.addEventListener('click', function (e) { if (!e.target.closest('.search')) pop.classList.add('hidden'); });
  }

  function bindUser() {
    document.addEventListener('click', function (e) {
      var b = e.target.closest('#userbtn'); if (!b) return;
      RC.popMenu(b, [{ label: '데모 데이터 초기화', icon: 'reset', fn: resetDemo }]);
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('#bell')) RC.toast('새 알림이 없어요. 코치 알림은 다음 학기에 제공돼요.');
    });
  }
  function resetDemo() {
    RC.confirm('모든 변경을 지우고 처음 시연 상태로 되돌릴까요?', '초기화', true).then(function (ok) {
      if (!ok) return;
      RC.store.reset(); renderTopbar(); bindSearch();
      if (location.hash !== '#/projects') location.hash = '#/projects'; else render();
      RC.toast('데모 데이터를 초기화했어요');
    });
  }

  /* ---------- coach (out of scope placeholder) ---------- */
  RC.views = RC.views || {};
  RC.views.coach = {
    acts: {}, ins: {},
    mount: function (el) {
      el.innerHTML = '<div class="page"><h1 class="title">코치 상담함</h1><p class="subtitle">코치와 함께 기록을 살펴보는 공간이에요.</p><div class="card coach-empty" style="margin-top:20px"><div>' + RC.sprout +
        '<h2>다음 학기 고도화 예정이에요</h2><p>코치 검토·승인 시스템은 이번 학기 개발 범위에서 제외되었어요.<br>지금은 학생이 직접 기록을 확인하고 수정하는 흐름에 집중하고 있어요.</p></div></div></div>';
    }
  };

  function boot() {
    RC.store.load();
    viewEl = $('view');
    renderTopbar(); bindSearch(); bindUser();
    // event delegation for views
    viewEl.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]'); if (!el || !RC.cur) return;
      var fn = RC.cur.acts[el.dataset.act]; if (fn) fn(el, e);
    });
    ['input', 'change'].forEach(function (ev) {
      viewEl.addEventListener(ev, function (e) {
        var el = e.target.closest('[data-in]'); if (!el || !RC.cur) return;
        var fn = RC.cur.ins[el.dataset.in]; if (fn) fn(el, e);
      });
    });
    viewEl.addEventListener('focusin', function (e) {
      var el = e.target.closest('[data-focus]'); if (el && RC.cur && RC.cur.ins[el.dataset.focus]) RC.cur.ins[el.dataset.focus](el, e);
    });
    window.addEventListener('hashchange', render);
    if (!location.hash) location.hash = '#/projects'; else render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.RC);

</script>
</body>
